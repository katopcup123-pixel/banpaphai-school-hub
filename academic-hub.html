<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ตารางสอน • วPA/SAR • ติดตามเด็กขาดเรียน — โรงเรียนบ้านป่าไผ่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4F6FB;
      --surface: #FFFFFF;
      --glass: rgba(255, 255, 255, 0.88);
      --fill: rgba(118, 118, 128, 0.11);
      --border: rgba(15, 23, 42, 0.08);
      --text: #0F172A;
      --secondary: #64748B;
      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --spring: cubic-bezier(0.32, 1.18, 0.56, 1);
    }
    [data-theme="dark"] {
      --bg: #0B0D12;
      --surface: #1C1C1E;
      --glass: rgba(24, 24, 28, 0.88);
      --fill: rgba(118, 118, 128, 0.24);
      --border: rgba(255, 255, 255, 0.09);
      --text: #F2F2F7;
      --secondary: #AEAEB2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans Thai", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .app { max-width: 560px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      flex-shrink: 0; background: var(--glass); backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 0.5px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px; z-index: 20;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .top-row h1 { margin: 0; font-size: 17.5px; font-weight: 700; letter-spacing: -0.02em; }
    .sub-line { font-size: 11.5px; color: var(--secondary); margin-top: 2px; }
    .seg-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
      background: var(--fill); padding: 4px; border-radius: 13px; margin-top: 10px;
    }
    .seg-btn {
      border: none; background: transparent; color: var(--secondary);
      font-family: inherit; font-size: 12px; font-weight: 600;
      padding: 7px 4px; border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .seg-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08); }

    .body-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 16px calc(32px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }
    .body-scroll::-webkit-scrollbar { display: none; }

    .card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 20px; padding: 14px; margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }
    .card h2 { margin: 0 0 8px; font-size: 14.5px; font-weight: 700; }
    .meta { font-size: 11.5px; color: var(--secondary); }
    .field, .select-field, .textarea-field {
      width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 14.5px;
      margin-bottom: 8px; outline: none;
    }
    .field:focus, .select-field:focus, .textarea-field:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; border: none; background: var(--accent); color: #FFF;
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      height: 42px; border-radius: 13px; cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-soft {
      border: none; background: var(--fill); color: var(--text);
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      padding: 8px 12px; border-radius: 11px; cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn-soft.danger { color: #DC2626; background: rgba(239, 68, 68, 0.12); }

    .tt-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .tt-table th, .tt-table td { border: 0.5px solid var(--border); padding: 6px 4px; text-align: center; }
    .tt-table th { background: var(--bg); font-weight: 700; color: var(--secondary); }
    .tt-cell { cursor: pointer; border-radius: 6px; padding: 4px 2px; min-height: 36px; display: flex; flex-direction: column; justify-content: center; }
    .tt-cell:active { background: var(--accent-soft); }
    .tt-subj { font-weight: 600; color: var(--text); font-size: 11px; }
    .tt-tchr { font-size: 9.5px; color: var(--secondary); }

    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 10px 8px; text-align: center; }
    .kpi-num { font-size: 20px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .kpi-lbl { font-size: 10.5px; color: var(--secondary); margin-top: 2px; }

    .item-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 10px 0; border-bottom: 0.5px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .badge {
      display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); margin-right: 4px;
    }
    .badge.red { background: rgba(239, 68, 68, 0.14); color: #DC2626; }
    .badge.amber { background: rgba(245, 158, 11, 0.16); color: #B45309; }
    .badge.green { background: rgba(16, 185, 129, 0.14); color: #059669; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); color: #FFF; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 999px; display: none; z-index: 90;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-row">
        <div>
          <h1>📚 วิชาการ • วPA/SAR • เฝ้าระวัง</h1>
          <div class="sub-line" id="userSub">โรงเรียนบ้านป่าไผ่</div>
        </div>
        <button type="button" class="btn-soft" id="exportTabPdfBtn">🖨️ PDF</button>
      </div>
      <div class="seg-bar">
        <button type="button" class="seg-btn active" data-tab="timetable">ตารางสอน/แทน</button>
        <button type="button" class="seg-btn" data-tab="pa">วPA / PLC / SAR</button>
        <button type="button" class="seg-btn" data-tab="warning">เฝ้าระวังขาดเรียน</button>
      </div>
    </header>
    <main class="body-scroll" id="mainBody"></main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./apps-config.js"></script>
  <script src="./students-data.js"></script>
  <script src="./pdf-export.js"></script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("bpp_connect_theme_v1") || "light";
    document.documentElement.style.setProperty("--accent", localStorage.getItem("bpp_connect_accent_v1") || "#007AFF");

    const STORAGE_KEY = "bpp_academic_hub_v1";
    const DAYS = ["จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์"];
    const PERIODS = [1, 2, 3, 4, 5, 6];
    const GRADES = ["อ.2", "อ.3", "ป.1", "ป.2", "ป.3", "ป.4", "ป.5", "ป.6"];
    const TEACHERS = [
      { id: "narisara", name: "ครูนริศรา" },
      { id: "namphet", name: "ครูน้ำเพชร" },
      { id: "pacharasaran", name: "ครูพชรศรัณย์" },
      { id: "thanakarin", name: "ครูธานครินทร์" },
      { id: "nantaphat", name: "ครูนันทพัทธ์" },
      { id: "napaporn", name: "ผอ.นภาพร" }
    ];

    function getCurrentTeacher() {
      const uid = localStorage.getItem("bpp_connect_user_v1");
      const users = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.users) || [];
      return users.find((u) => u.id === uid) || users[0] || { id: "", name: "บุคลากร", shortName: "คุณครู" };
    }
    const currentTeacher = getCurrentTeacher();
    document.getElementById("userSub").textContent = `ผู้ใช้งาน: ${currentTeacher.shortName || currentTeacher.name}`;

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function defaultData() {
      // ตัวอย่างตารางสอนเริ่มต้น (แก้ไขได้ทุกช่อง)
      const tt = {};
      const sample = {
        "ป.1": [["ภาษาไทย","ครูน้ำเพชร"],["คณิตศาสตร์","ครูน้ำเพชร"],["วิทย์ฯ","ครูธานครินทร์"],["อังกฤษ","ครูน้ำเพชร"],["สังคมฯ","ครูพชรศรัณย์"],["ศิลปะ/พละ","ครูนันทพัทธ์"]],
        "ป.4": [["คณิตศาสตร์","ครูธานครินทร์"],["ภาษาไทย","ครูพชรศรัณย์"],["วิทย์ฯ","ครูธานครินทร์"],["อังกฤษ","ครูน้ำเพชร"],["สังคมฯ","ครูนันทพัทธ์"],["คอมพิวเตอร์","ครูธานครินทร์"]],
        "ป.6": [["วิทย์ฯ","ครูนันทพัทธ์"],["คณิตศาสตร์","ครูนันทพัทธ์"],["ภาษาไทย","ครูพชรศรัณย์"],["อังกฤษ","ครูน้ำเพชร"],["วิทยาการคำนวณ","ครูธานครินทร์"],["แนะแนว/ชุมนุม","ครูนันทพัทธ์"]]
      };
      GRADES.forEach((g) => {
        tt[g] = {};
        DAYS.forEach((d, di) => {
          tt[g][d] = PERIODS.map((p, pi) => {
            const row = (sample[g] && sample[g][(pi + di) % 6]) || ["กิจกรรมเรียนรู้", g.startsWith("อ.") ? "ครูนริศรา" : "ครูประจำชั้น"];
            return { subject: row[0], teacher: row[1] };
          });
        });
      });
      return {
        updatedAt: 0,
        timetable: tt,
        subLogs: [],
        paItems: [
          {
            id: "pa-1",
            year: "2569",
            teacher: currentTeacher.shortName || "ครูธานครินทร์",
            category: "PLC / อบรมพัฒนาตนเอง",
            standard: "มาตรฐานที่ 3 การจัดการเรียนการสอน",
            title: "PLC การจัดการเรียนรู้เชิงรุก (Active Learning) ภาคเรียนที่ 2",
            hours: 4,
            date: new Date().toISOString().slice(0, 10),
            note: "แลกเปลี่ยนเรียนรู้ร่วมกันทั้งโรงเรียน"
          }
        ]
      };
    }

    let db = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.timetable) return parsed;
        }
      } catch (_) {}
      return defaultData();
    })();

    function saveDb() {
      db.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (_) {}
      const apiUrl = (localStorage.getItem("bpp_connect_news_api_v1") || (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.newsBackendUrl) || "").trim();
      if (apiUrl) {
        fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "save_kv", key: STORAGE_KEY, value: db })
        }).catch(() => {});
      }
    }

    function pullCloud() {
      const apiUrl = (localStorage.getItem("bpp_connect_news_api_v1") || (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.newsBackendUrl) || "").trim();
      if (!apiUrl) return;
      fetch(`${apiUrl}?action=get_kv&key=${encodeURIComponent(STORAGE_KEY)}`, { cache: "no-store" })
        .then((r) => r.json())
        .then((json) => {
          if (json && json.ok && json.value && json.value.timetable && (json.value.updatedAt || 0) > (db.updatedAt || 0)) {
            db = json.value;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            render();
          }
        })
        .catch(() => {});
    }

    const ui = {
      tab: "timetable",
      grade: "ป.6",
      subTeacher: "ครูธานครินทร์",
      subDay: DAYS[Math.min(4, Math.max(0, new Date().getDay() - 1))],
      paYear: "2569",
      paFilterTeacher: "all",
      warnThreshold: 3
    };

    function findFreeTeachers(day, periodIdx, excludeTeacher) {
      const busy = new Set();
      GRADES.forEach((g) => {
        const cell = db.timetable[g] && db.timetable[g][day] && db.timetable[g][day][periodIdx];
        if (cell && cell.teacher) busy.add(cell.teacher);
      });
      return TEACHERS.map((t) => t.name).filter((n) => n !== excludeTeacher && !busy.has(n));
    }

    function getEarlyWarningList() {
      const students = (window.BPP_STUDENTS_HELPER && window.BPP_STUDENTS_HELPER.loadStudents()) || (window.BPP_DEFAULT_STUDENTS || []);
      let attRecords = {};
      try { attRecords = JSON.parse(localStorage.getItem("bpp_attendance_records_v1") || "{}"); } catch (_) {}
      const dates = Object.keys(attRecords).sort();
      return students.map((st) => {
        let totalAbs = 0, maxStreak = 0, curStreak = 0;
        dates.forEach((dk) => {
          const val = (attRecords[dk] || {})[st.id] || (attRecords[dk] || {})[st.code];
          if (val === "absent" || val === "ขาด") {
            totalAbs++; curStreak++; if (curStreak > maxStreak) maxStreak = curStreak;
          } else if (val) {
            curStreak = 0;
          }
        });
        return { ...st, totalAbs, maxStreak };
      }).filter((st) => st.totalAbs >= ui.warnThreshold || st.maxStreak >= 2)
        .sort((a, b) => b.totalAbs - a.totalAbs);
    }

    function renderTimetable() {
      const grid = db.timetable[ui.grade] || {};
      // หาคาบที่ครูที่เลือกต้องสอนในวันนั้น
      const targetClasses = [];
      GRADES.forEach((g) => {
        const row = (db.timetable[g] && db.timetable[g][ui.subDay]) || [];
        row.forEach((cell, pi) => {
          if (cell && cell.teacher === ui.subTeacher) {
            targetClasses.push({ grade: g, period: pi + 1, periodIdx: pi, subject: cell.subject, free: findFreeTeachers(ui.subDay, pi, ui.subTeacher) });
          }
        });
      });

      return `
        <div class="card">
          <h2>📅 ตารางสอนรายชั้น (แตะที่ช่องเพื่อแก้ไข)</h2>
          <select class="select-field" id="ttGradeSel">
            ${GRADES.map((g) => `<option value="${g}" ${ui.grade === g ? "selected" : ""}>ชั้น ${g}</option>`).join("")}
          </select>
          <div style="overflow-x:auto">
            <table class="tt-table">
              <thead><tr><th>วัน</th>${PERIODS.map((p) => `<th>คาบ ${p}</th>`).join("")}</tr></thead>
              <tbody>
                ${DAYS.map((d) => `
                  <tr>
                    <td><strong>${d}</strong></td>
                    ${PERIODS.map((p, pi) => {
                      const c = (grid[d] && grid[d][pi]) || { subject: "-", teacher: "" };
                      return `<td><div class="tt-cell" data-edit-cell="${d}|${pi}"><span class="tt-subj">${c.subject}</span><span class="tt-tchr">${c.teacher}</span></div></td>`;
                    }).join("")}
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>🔄 ค้นหาครูสอนแทนอัตโนมัติ</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <select class="select-field" id="subTeacherSel">
              ${TEACHERS.map((t) => `<option value="${t.name}" ${ui.subTeacher === t.name ? "selected" : ""}>${t.name} ลา/ไปราชการ</option>`).join("")}
            </select>
            <select class="select-field" id="subDaySel">
              ${DAYS.map((d) => `<option value="${d}" ${ui.subDay === d ? "selected" : ""}>วัน${d}</option>`).join("")}
            </select>
          </div>
          ${targetClasses.length ? targetClasses.map((tc) => `
            <div class="item-row">
              <div>
                <div><span class="badge">คาบ ${tc.period}</span><strong>${tc.grade} • ${tc.subject}</strong></div>
                <div class="meta" style="margin-top:3px">ครูที่ว่างคาบนี้: ${tc.free.length ? tc.free.join(", ") : "ไม่มีครูว่าง"}</div>
              </div>
              ${tc.free.length ? `<button type="button" class="btn-soft" data-assign-sub="${tc.grade}|${tc.period}|${tc.subject}|${tc.free[0]}">มอบหมาย ${tc.free[0]}</button>` : ""}
            </div>
          `).join("") : `<div class="meta">ไม่พบคาบสอนของ ${ui.subTeacher} ในวัน${ui.subDay}</div>`}
        </div>

        ${(db.subLogs || []).length ? `
          <div class="card">
            <h2>📝 ประวัติการจัดสอนแทนล่าสุด</h2>
            ${db.subLogs.slice(0, 6).map((lg) => `
              <div class="item-row">
                <div>
                  <div style="font-size:13px;font-weight:600">${lg.date} • คาบ ${lg.period} (${lg.grade} ${lg.subject})</div>
                  <div class="meta">แทน ${lg.absentTeacher} → <strong>${lg.subTeacher}</strong></div>
                </div>
                <button type="button" class="btn-soft danger" data-del-sub="${lg.id}">ลบ</button>
              </div>
            `).join("")}
          </div>` : ""}
      `;
    }

    function renderPaSar() {
      const items = (db.paItems || []).filter((it) => {
        if (ui.paYear !== "all" && it.year !== ui.paYear) return false;
        if (ui.paFilterTeacher !== "all" && it.teacher !== ui.paFilterTeacher) return false;
        return true;
      });
      const totalHours = items.reduce((acc, it) => acc + (Number(it.hours) || 0), 0);
      const plcCount = items.filter((it) => String(it.category).includes("PLC")).length;
      const certCount = items.filter((it) => String(it.category).includes("เกียรติบัตร") || String(it.category).includes("ผลงาน")).length;

      return `
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-num">${totalHours}</div><div class="kpi-lbl">ชั่วโมง PLC/อบรม</div></div>
          <div class="kpi-box"><div class="kpi-num">${plcCount}</div><div class="kpi-lbl">รายการ PLC</div></div>
          <div class="kpi-box"><div class="kpi-num">${certCount}</div><div class="kpi-lbl">ผลงาน/เกียรติบัตร</div></div>
        </div>

        <div class="card">
          <h2>➕ บันทึกผลงาน วPA / ชั่วโมง PLC / หลักฐาน SAR</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <select class="select-field" id="paYearIn">
              ${["2569","2570","2571","2572"].map((y) => `<option value="${y}" ${ui.paYear === y ? "selected" : ""}>ปีการศึกษา ${y}</option>`).join("")}
            </select>
            <select class="select-field" id="paCatIn">
              <option value="PLC / อบรมพัฒนาตนเอง">PLC / อบรมพัฒนาตนเอง</option>
              <option value="ผลงานครู / วPA">ผลงานครู / วPA</option>
              <option value="เกียรติบัตร / รางวัล">เกียรติบัตร / รางวัล</option>
              <option value="หลักฐาน SAR ประกันคุณภาพ">หลักฐาน SAR ประกันคุณภาพ</option>
            </select>
          </div>
          <select class="select-field" id="paStdIn">
            <option value="มาตรฐานที่ 1 คุณภาพของผู้เรียน">มาตรฐานที่ 1 คุณภาพของผู้เรียน</option>
            <option value="มาตรฐานที่ 2 กระบวนการบริหารและการจัดการ">มาตรฐานที่ 2 กระบวนการบริหารและการจัดการ</option>
            <option value="มาตรฐานที่ 3 กระบวนการจัดการเรียนการสอนที่เน้นผู้เรียนเป็นสำคัญ">มาตรฐานที่ 3 การจัดการเรียนการสอน</option>
          </select>
          <input class="field" id="paTitleIn" placeholder="ชื่อกิจกรรม / ผลงาน / หัวข้อ PLC หรืออบรม" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <input class="field" id="paHoursIn" type="number" min="0" step="0.5" placeholder="จำนวนชั่วโมง (ถ้ามี)" value="2" />
            <input class="field" id="paDateIn" type="date" value="${new Date().toISOString().slice(0,10)}" />
          </div>
          <input class="field" id="paNoteIn" placeholder="หมายเหตุ / ลิงก์เกียรติบัตรหรือภาพหลักฐาน (ถ้ามี)" />
          <button type="button" class="btn-primary" id="savePaBtn">บันทึกลงคลัง วPA / SAR</button>
        </div>

        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
            <h2 style="margin:0">📂 รายการที่บันทึก (${items.length})</h2>
            <select class="select-field" id="paTeacherFilter" style="width:auto;margin:0;padding:6px 10px;font-size:12px">
              <option value="all">ครูทุกคน</option>
              ${TEACHERS.map((t) => `<option value="${t.name}" ${ui.paFilterTeacher === t.name ? "selected" : ""}>${t.name}</option>`).join("")}
            </select>
          </div>
          ${items.length ? items.map((it) => `
            <div class="item-row">
              <div style="flex:1;min-width:0">
                <div><span class="badge">${it.category}</span><span class="badge green">${it.hours || 0} ชม.</span></div>
                <div style="font-size:13.5px;font-weight:600;margin-top:4px">${it.title}</div>
                <div class="meta">${it.teacher} • ${it.standard} • ${it.date}</div>
                ${it.note ? `<div class="meta" style="margin-top:2px">${it.note}</div>` : ""}
              </div>
              <button type="button" class="btn-soft danger" data-del-pa="${it.id}">ลบ</button>
            </div>
          `).join("") : `<div class="meta">ยังไม่มีรายการในปีการศึกษานี้</div>`}
        </div>
      `;
    }

    function renderWarning() {
      const list = getEarlyWarningList();
      return `
        <div class="card">
          <h2>🚨 ระบบเฝ้าระวังนักเรียนขาดเรียนบ่อย (Early Warning)</h2>
          <div class="meta" style="margin-bottom:10px">ดึงข้อมูลตรงจากระบบเช็คสถิตินักเรียน อัตโนมัติเมื่อขาดสะสมถึงเกณฑ์ หรือขาดติดกัน ≥ 2 วัน</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="meta">เกณฑ์แจ้งเตือน (วัน):</span>
            ${[2, 3, 5].map((n) => `<button type="button" class="btn-soft" style="${ui.warnThreshold === n ? "background:var(--accent);color:#FFF" : ""}" data-warn-th="${n}">≥ ${n} วัน</button>`).join("")}
          </div>
        </div>

        <div class="card">
          <h2>รายชื่อนักเรียนที่ต้องติดตาม (${list.length} คน)</h2>
          ${list.length ? list.map((st) => `
            <div class="item-row">
              <div>
                <div>
                  <span class="badge ${st.totalAbs >= 5 || st.maxStreak >= 3 ? "red" : "amber"}">${st.totalAbs >= 5 || st.maxStreak >= 3 ? "เสี่ยงสูง" : "เฝ้าระวัง"}</span>
                  <strong>${st.prefix || ""}${st.firstName} ${st.lastName}</strong> (${st.grade})
                </div>
                <div class="meta" style="margin-top:3px">ขาดสะสม ${st.totalAbs} วัน • ขาดติดกันสูงสุด ${st.maxStreak} วัน</div>
              </div>
              <a class="btn-soft" href="./classroom.html">บันทึกเยี่ยมบ้าน →</a>
            </div>
          `).join("") : `<div class="meta">✅ ยังไม่พบนักเรียนที่ขาดเรียนเกินเกณฑ์ — ยอดเยี่ยมมากครับ!</div>`}
        </div>
      `;
    }

    function render() {
      document.querySelectorAll(".seg-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === ui.tab));
      const body = document.getElementById("mainBody");
      if (ui.tab === "timetable") body.innerHTML = renderTimetable();
      else if (ui.tab === "pa") body.innerHTML = renderPaSar();
      else body.innerHTML = renderWarning();
      wireEvents();
    }

    function wireEvents() {
      const gSel = document.getElementById("ttGradeSel");
      if (gSel) gSel.onchange = (e) => { ui.grade = e.target.value; render(); };
      const stSel = document.getElementById("subTeacherSel");
      if (stSel) stSel.onchange = (e) => { ui.subTeacher = e.target.value; render(); };
      const sdSel = document.getElementById("subDaySel");
      if (sdSel) sdSel.onchange = (e) => { ui.subDay = e.target.value; render(); };

      document.querySelectorAll("[data-edit-cell]").forEach((el) => {
        el.onclick = () => {
          const [day, piStr] = el.dataset.editCell.split("|");
          const pi = Number(piStr);
          const cur = db.timetable[ui.grade][day][pi] || { subject: "", teacher: "" };
          const subj = prompt(`แก้ไขวิชา (${ui.grade} วัน${day} คาบ ${pi + 1}):`, cur.subject);
          if (subj === null) return;
          const tchr = prompt(`ระบุชื่อครูผู้สอน (${TEACHERS.map(t => t.name).join(", ")}):`, cur.teacher);
          if (tchr === null) return;
          db.timetable[ui.grade][day][pi] = { subject: subj.trim() || "-", teacher: tchr.trim() };
          saveDb(); showToast("บันทึกตารางสอนแล้ว"); render();
        };
      });

      document.querySelectorAll("[data-assign-sub]").forEach((btn) => {
        btn.onclick = () => {
          const [grade, period, subject, subTeacher] = btn.dataset.assignSub.split("|");
          db.subLogs = db.subLogs || [];
          db.subLogs.unshift({
            id: "sub-" + Date.now(),
            date: new Date().toISOString().slice(0, 10),
            day: ui.subDay, grade, period, subject,
            absentTeacher: ui.subTeacher, subTeacher
          });
          saveDb(); showToast(`มอบหมาย ${subTeacher} สอนแทนคาบ ${period} แล้ว`); render();
        };
      });

      document.querySelectorAll("[data-del-sub]").forEach((btn) => {
        btn.onclick = () => {
          db.subLogs = (db.subLogs || []).filter((x) => x.id !== btn.dataset.delSub);
          saveDb(); render();
        };
      });

      const savePaBtn = document.getElementById("savePaBtn");
      if (savePaBtn) savePaBtn.onclick = () => {
        const title = document.getElementById("paTitleIn").value.trim();
        if (!title) { showToast("กรุณากรอกชื่อกิจกรรมหรือผลงาน"); return; }
        db.paItems = db.paItems || [];
        db.paItems.unshift({
          id: "pa-" + Date.now(),
          year: document.getElementById("paYearIn").value,
          teacher: currentTeacher.shortName || currentTeacher.name,
          category: document.getElementById("paCatIn").value,
          standard: document.getElementById("paStdIn").value,
          title,
          hours: Number(document.getElementById("paHoursIn").value) || 0,
          date: document.getElementById("paDateIn").value,
          note: document.getElementById("paNoteIn").value.trim()
        });
        saveDb(); showToast("บันทึกลงคลัง วPA / SAR แล้ว"); render();
      };

      const paTf = document.getElementById("paTeacherFilter");
      if (paTf) paTf.onchange = (e) => { ui.paFilterTeacher = e.target.value; render(); };
      document.querySelectorAll("[data-del-pa]").forEach((btn) => {
        btn.onclick = () => {
          db.paItems = (db.paItems || []).filter((x) => x.id !== btn.dataset.delPa);
          saveDb(); render();
        };
      });
      document.querySelectorAll("[data-warn-th]").forEach((btn) => {
        btn.onclick = () => { ui.warnThreshold = Number(btn.dataset.warnTh); render(); };
      });
    }

    document.querySelectorAll(".seg-btn").forEach((b) => {
      b.onclick = () => { ui.tab = b.dataset.tab; render(); };
    });

    document.getElementById("exportTabPdfBtn").onclick = async () => {
      let html = "";
      let fileName = "รายงานวิชาการ.pdf";
      if (ui.tab === "timetable") {
        fileName = `ตารางสอน_${ui.grade}.pdf`;
        const grid = db.timetable[ui.grade] || {};
        html = `<div style="font-family:'THSarabunIT9',sans-serif;font-size:16pt">
          <div style="text-align:center;font-weight:700;font-size:18pt">ตารางสอนชั้น ${ui.grade} โรงเรียนบ้านป่าไผ่</div>
          <table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:15pt">
            <tr><th style="border:1px solid #000;padding:5px">วัน</th>${PERIODS.map(p => `<th style="border:1px solid #000;padding:5px">คาบ ${p}</th>`).join("")}</tr>
            ${DAYS.map(d => `<tr><td style="border:1px solid #000;padding:5px;font-weight:700">${d}</td>${PERIODS.map((_,pi) => {
              const c = (grid[d] && grid[d][pi]) || { subject: "-", teacher: "" };
              return `<td style="border:1px solid #000;padding:5px;text-align:center">${c.subject}<br><span style="font-size:13pt">${c.teacher}</span></td>`;
            }).join("")}</tr>`).join("")}
          </table>
        </div>`;
      } else if (ui.tab === "pa") {
        fileName = `สรุป_วPA_PLC_SAR_${ui.paYear}.pdf`;
        const items = (db.paItems || []).filter((it) => ui.paYear === "all" || it.year === ui.paYear);
        html = `<div style="font-family:'THSarabunIT9',sans-serif;font-size:16pt">
          <div style="text-align:center;font-weight:700;font-size:18pt">สรุปคลังผลงาน วPA / PLC / SAR ปีการศึกษา ${ui.paYear}</div>
          <div style="text-align:center;margin-bottom:10px">โรงเรียนบ้านป่าไผ่ สพป.นครราชสีมา เขต 4</div>
          <table style="width:100%;border-collapse:collapse;font-size:15pt">
            <tr><th style="border:1px solid #000;padding:5px">วันที่</th><th style="border:1px solid #000;padding:5px">ครูผู้บันทึก</th><th style="border:1px solid #000;padding:5px">รายการ / มาตรฐาน</th><th style="border:1px solid #000;padding:5px">ชม.</th></tr>
            ${items.map(it => `<tr><td style="border:1px solid #000;padding:5px">${it.date}</td><td style="border:1px solid #000;padding:5px">${it.teacher}</td><td style="border:1px solid #000;padding:5px">${it.title} (${it.standard})</td><td style="border:1px solid #000;padding:5px;text-align:center">${it.hours||0}</td></tr>`).join("")}
          </table>
        </div>`;
      } else {
        fileName = `เฝ้าระวังนักเรียนขาดเรียน.pdf`;
        const list = getEarlyWarningList();
        html = `<div style="font-family:'THSarabunIT9',sans-serif;font-size:16pt">
          <div style="text-align:center;font-weight:700;font-size:18pt">รายงานเฝ้าระวังนักเรียนขาดเรียนบ่อย โรงเรียนบ้านป่าไผ่</div>
          <table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:15pt">
            <tr><th style="border:1px solid #000;padding:5px">ชื่อ-สกุล</th><th style="border:1px solid #000;padding:5px">ชั้น</th><th style="border:1px solid #000;padding:5px">ขาดสะสม (วัน)</th><th style="border:1px solid #000;padding:5px">ติดกันสูงสุด</th></tr>
            ${list.length ? list.map(s => `<tr><td style="border:1px solid #000;padding:5px">${s.prefix||""}${s.firstName} ${s.lastName}</td><td style="border:1px solid #000;padding:5px;text-align:center">${s.grade}</td><td style="border:1px solid #000;padding:5px;text-align:center">${s.totalAbs}</td><td style="border:1px solid #000;padding:5px;text-align:center">${s.maxStreak}</td></tr>`).join("") : `<tr><td colspan="4" style="border:1px solid #000;padding:8px;text-align:center">ไม่มีนักเรียนขาดเรียนเกินเกณฑ์</td></tr>`}
          </table>
        </div>`;
      }
      if (window.BPP_PDF && window.BPP_PDF.exportA4) {
        await window.BPP_PDF.exportA4({ html, fileName, title: fileName });
      } else {
        window.print();
      }
    };

    render();
    pullCloud();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ระบบธุรการโรงเรียน — BPP Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: "TH SarabunIT9"; src: url("./fonts/THSarabunIT9.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "TH SarabunIT9"; src: url("./fonts/THSarabunIT9-Bold.ttf") format("truetype"); font-weight: 700; }
    :root {
      --bg: #F2F4F8; --surface: #FFFFFF; --surface-soft: rgba(255,255,255,0.88);
      --text: #1C1C1E; --secondary: #6C6C70; --sep: rgba(60,60,67,0.12);
      --accent: #007AFF; --green: #16A34A; --red: #DC2626; --amber: #D97706; --purple: #7C3AED; --teal: #0D9488;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    [data-theme="dark"] {
      --bg: #0B0D12; --surface: #1C1C1E; --surface-soft: rgba(28,28,32,0.88);
      --text: #F2F2F7; --secondary: #98989F; --sep: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans Thai", sans-serif;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    .app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .topbar {
      flex-shrink: 0; padding: 12px 16px 10px;
      background: var(--surface-soft); backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-bottom: 0.5px solid var(--sep);
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title-wrap h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .user-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--secondary); margin-top: 2px; }
    .mini-avatar { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

    .body-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 36px; }

    .hub-banner {
      background: linear-gradient(135deg, #4F46E5, #2563EB);
      color: #fff; border-radius: 20px; padding: 14px 16px; margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(79,70,229,0.22); animation: popIn 0.35s var(--spring) both;
    }
    .hub-banner h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .hub-banner p { margin: 4px 0 0; font-size: 12.5px; opacity: 0.92; }

    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .menu-tile {
      background: var(--surface); border: 1px solid var(--sep); border-radius: 18px;
      padding: 14px 12px; text-align: left; cursor: pointer; color: var(--text); font: inherit;
      display: flex; flex-direction: column; gap: 8px;
      transition: transform 0.16s var(--spring); animation: slideUp 0.28s ease both;
    }
    .menu-tile:active { transform: scale(0.96); }
    .tile-top { display: flex; align-items: center; justify-content: space-between; }
    .tile-ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; }
    .c-blue { background: rgba(0,122,255,0.13); }
    .c-green { background: rgba(22,163,74,0.14); }
    .c-amber { background: rgba(217,119,6,0.14); }
    .c-purple { background: rgba(124,58,237,0.14); }
    .c-teal { background: rgba(13,148,136,0.14); }
    .c-rose { background: rgba(220,38,38,0.13); }
    .c-indigo { background: rgba(79,70,229,0.14); }
    .c-slate { background: rgba(100,116,139,0.14); }
    .tile-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--secondary); }
    .tile-title { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
    .tile-sub { font-size: 11.5px; color: var(--secondary); line-height: 1.35; }

    .btn-primary, .btn-soft, .btn-green {
      border: none; font: inherit; font-size: 12.5px; font-weight: 600;
      border-radius: 11px; padding: 8px 12px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-soft { background: var(--surface); color: var(--text); border: 1px solid var(--sep); }

    .card {
      background: var(--surface); border-radius: 16px; padding: 12px 13px;
      border: 1px solid var(--sep); margin-bottom: 9px; animation: slideUp 0.24s ease both;
    }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .item-title { font-size: 14px; font-weight: 700; }
    .item-meta { font-size: 11.5px; color: var(--secondary); margin-top: 2px; line-height: 1.45; }
    .pill-tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .t-ok { background: rgba(22,163,74,0.14); color: var(--green); }
    .t-warn { background: rgba(217,119,6,0.14); color: var(--amber); }
    .t-info { background: rgba(0,122,255,0.13); color: var(--accent); }

    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .field, .select-field, .textarea-field {
      width: 100%; border: 1px solid var(--sep); background: var(--bg); color: var(--text);
      border-radius: 11px; padding: 9px 11px; font: inherit; font-size: 13.5px; margin-bottom: 9px; outline: none;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lbl { display: block; font-size: 11.5px; font-weight: 600; color: var(--secondary); margin-bottom: 3px; }

    .kpi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi-box { background: var(--surface); border: 1px solid var(--sep); border-radius: 15px; padding: 10px 6px; text-align: center; }
    .kpi-box strong { display: block; font-size: 20px; color: var(--accent); }
    .kpi-box span { font-size: 11px; color: var(--secondary); font-weight: 600; }

    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.42); backdrop-filter: blur(4px); z-index: 60;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 12px 16px calc(22px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform 0.34s var(--spring);
    }
    .backdrop.open .sheet { transform: translateY(0); }
    .grabber { width: 38px; height: 4px; border-radius: 99px; background: rgba(120,120,128,0.35); margin: 0 auto 10px; }
    .sheet h3 { margin: 0 0 8px; font-size: 16px; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 90; background: rgba(15,23,42,0.92); color: #fff;
      font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px; display: none;
    }
    .toast.show { display: block; }
    .hidden { display: none !important; }

    .pdf-doc, .pdf-doc * { font-family: "TH SarabunIT9", serif; font-size: 16pt !important; color: #000; -webkit-text-size-adjust: 100% !important; }
    .pdf-doc table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    .pdf-doc th, .pdf-doc td { border: 1px solid #000; padding: 2px 5px; text-align: center; }
    .pdf-doc td.left { text-align: left; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-row">
        <div class="title-wrap">
          <h1 id="pageTitle">ระบบธุรการโรงเรียน</h1>
          <div class="user-sub" id="userSub">โรงเรียนบ้านป่าไผ่</div>
        </div>
        <button type="button" class="btn-soft hidden" id="backHubBtn">‹ เมนูทั้งหมด</button>
      </div>
    </header>
    <main class="body-scroll" id="mainArea"></main>
  </div>

  <div class="backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="grabber"></div>
      <div id="sheetContent"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./apps-config.js"></script>
  <script src="./pdf-export.js"></script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("bpp_connect_theme_v1") || "light";
    document.documentElement.style.setProperty("--accent", localStorage.getItem("bpp_connect_accent_v1") || "#007AFF");

    const STORAGE_KEY = "bpp_admin_office_v1";
    function getAllUsers() {
      let u = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.users) || [];
      try { const r = localStorage.getItem("bpp_connect_users_v3"); if (r) { const p = JSON.parse(r); if (p.length) u = p; } } catch (_) {}
      return u;
    }
    function getUser() {
      const uid = localStorage.getItem("bpp_connect_user_v1");
      const users = getAllUsers();
      return users.find((u) => u.id === uid) || users[0] || { id: "", name: "บุคลากรโรงเรียนบ้านป่าไผ่", shortName: "คุณครู", role: "teacher", avatar: "" };
    }

    const me = getUser();
    const isStaffAdmin = me.role === "admin" || me.role === "director" || me.id === "pattaraya";
    const backendUrl = ((window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.newsBackendUrl) || "").trim();
    const $ = (id) => document.getElementById(id);

    const DEFAULT_DATA = {
      orders: [],      // [{ id, orderNo, title, date, owner, fileUrl }]
      roster: { Mon: "ครูนริศรา", Tue: "ครูน้ำเพชร", Wed: "ครูพชรศรัณย์", Thu: "ครูธานครินทร์", Fri: "ครูนันทพัทธ์", nightGuard: "นายกุล ดีสันเทียะ", lastCheck: "" },
      certs: [],       // [{ id, certNo, kind, forName, purpose, date, status, by }]
      assets: [
        { id: "as-1", code: "ครุภัณฑ์-01", name: "โปรเจกเตอร์ห้องประชุม", room: "ห้องประชุม", status: "ว่าง", borrower: "" },
        { id: "as-2", code: "ครุภัณฑ์-02", name: "ชุดไมค์ลอย + ลำโพงพกพา", room: "ห้องธุรการ", status: "ว่าง", borrower: "" },
        { id: "as-3", code: "ครุภัณฑ์-03", name: "โน้ตบุ๊กส่วนกลางโรงเรียน", room: "ห้องธุรการ", status: "ว่าง", borrower: "" }
      ],
      transfers: [],   // [{ id, kind, stuName, grade, school, docNo, date }]
      visitors: []     // [{ id, name, org, purpose, date, timeIn, timeOut }]
    };

    const state = {
      view: "hub",
      data: (() => { try { return { ...DEFAULT_DATA, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") }; } catch (_) { return { ...DEFAULT_DATA }; } })()
    };

    function showToast(m) {
      const el = $("toast"); el.textContent = m; el.classList.add("show");
      clearTimeout(showToast._t); showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
    }
    function openSheet(html) { $("sheetContent").innerHTML = html; $("sheetBackdrop").classList.add("open"); }
    function closeSheet() { $("sheetBackdrop").classList.remove("open"); }
    $("sheetBackdrop").onclick = (e) => { if (e.target === $("sheetBackdrop")) closeSheet(); };

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (_) {}
      if (backendUrl) {
        fetch(backendUrl, {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "save_kv", key: "admin_office_v1", value: state.data })
        }).catch(() => {});
      }
    }

    async function syncCloud() {
      if (!backendUrl) return;
      try {
        const res = await fetch(`${backendUrl}?action=get_kv&key=admin_office_v1`, { cache: "no-store" });
        const json = await res.json();
        if (json && json.ok && json.value && typeof json.value === "object") {
          state.data = { ...DEFAULT_DATA, ...json.value };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (_) {}
          render();
        }
      } catch (_) {}
    }

    function exportTablePdf(title, headers, rowsHtml) {
      const html = `<div class="pdf-doc">
        <div style="text-align:center;font-weight:700;margin-bottom:6px">${title}<br/>โรงเรียนบ้านป่าไผ่ สพป.นครราชสีมา เขต ๔</div>
        <table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody></table>
        <div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;text-align:center">
          <div>ลงชื่อ........................................ผู้จัดทำ<br/>(นางสาวภัทรญา ยอดปทุมมานนท์)<br/>เจ้าหน้าที่ธุรการ</div>
          <div>ลงชื่อ........................................ผู้รับรอง<br/>(นางสาวนภาพร คงแสนคำ)<br/>ผู้อำนวยการโรงเรียนบ้านป่าไผ่</div>
        </div>
      </div>`;
      window.BPP_PDF.exportOrShare(html, `${title}.pdf`.replace(/\s+/g, "_"), { shareToAdmin: true, onStatus: showToast });
    }

    function renderHub() {
      const pendingLeaves = (() => {
        try { return JSON.parse(localStorage.getItem("bpp_connect_leaves_v1") || "[]").filter((x) => x.status === "pending").length; } catch (_) { return 0; }
      })();
      const pendingCerts = state.data.certs.filter((c) => c.status !== "ออกเอกสารแล้ว").length;
      const borrowedCnt = state.data.assets.filter((a) => a.status === "กำลังยืม").length;

      const items = [
        { id: "docs", ico: "📂", cls: "c-purple", title: "เอกสารธุรการ (รับ–ส่ง)", sub: "คลังเอกสารเดิม 112 ฉบับ & อัปโหลดมือถือ", badge: "เปิดระบบ ↗" },
        { id: "leave", ico: "📝", cls: "c-teal", title: "การลา & แบบฟอร์มบุคคล", sub: "ครบ 5 แบบฟอร์ม TH SarabunIT๙", badge: pendingLeaves ? `รอ ${pendingLeaves}` : "เปิดระบบ ↗" },
        { id: "orders", ico: "📜", cls: "c-blue", title: "ทะเบียนคำสั่ง & ประกาศ", sub: "รันเลขคำสั่งโรงเรียนอัตโนมัติ + PDF", badge: `${state.data.orders.length} ฉบับ` },
        { id: "roster", ico: "🛡️", cls: "c-amber", title: "ตารางครูเวร & เวรยาม", sub: "จัดเวรกลางวัน–กลางคืน & ตรวจเวร ผอ.", badge: "จ.–ศ." },
        { id: "certs", ico: "🎓", cls: "c-green", title: "ขอหนังสือรับรอง (ปพ.7)", sub: "ปพ.7 นักเรียน / รับรองเงินเดือนครู", badge: pendingCerts ? `รอ ${pendingCerts}` : `${state.data.certs.length} รายการ` },
        { id: "assets", ico: "📦", cls: "c-indigo", title: "ครุภัณฑ์ & ยืม–คืนอุปกรณ์", sub: "โปรเจกเตอร์ ไมค์ โน้ตบุ๊ก แยกห้อง", badge: borrowedCnt ? `ยืมอยู่ ${borrowedCnt}` : `${state.data.assets.length} ชิ้น` },
        { id: "transfers", ico: "🔄", cls: "c-rose", title: "นักเรียนเข้าใหม่ / ย้ายออก", sub: "ทะเบียน ปพ.1 / ปพ.6 & ส่งต่อ", badge: `${state.data.transfers.length} คน` },
        { id: "visitors", ico: "🤝", cls: "c-slate", title: "สมุดผู้มาติดต่อ & เสนอ ผอ.", sub: "ลงนามแขกเยี่ยม รร. & แดชบอร์ด ผอ.", badge: `${state.data.visitors.length} ครั้ง` }
      ];

      $("mainArea").innerHTML = `
        <div class="hub-banner">
          <h2>ศูนย์งานธุรการโรงเรียนบ้านป่าไผ่</h2>
          <p>งานสารบรรณ คำสั่ง ครุภัณฑ์ เวรยาม ทะเบียนนักเรียน และสมุดผู้มาติดต่อ</p>
        </div>
        <div class="menu-grid">
          ${items.map((it, idx) => `
            <button type="button" class="menu-tile" data-mod="${it.id}" style="animation-delay:${idx * 24}ms">
              <div class="tile-top">
                <div class="tile-ico ${it.cls}">${it.ico}</div>
                <span class="tile-badge">${it.badge}</span>
              </div>
              <div class="tile-title">${it.title}</div>
              <div class="tile-sub">${it.sub}</div>
            </button>`).join("")}
        </div>`;
    }

    function renderOrders() {
      $("mainArea").innerHTML = `
        <div class="action-bar">
          <button type="button" class="btn-primary" id="addOrderBtn">+ ออกเลขคำสั่งใหม่</button>
          <button type="button" class="btn-soft" id="pdfOrdersBtn">📤 Export PDF ทะเบียนคำสั่ง</button>
        </div>
        ${state.data.orders.length ? state.data.orders.map((o) => `
          <div class="card">
            <div class="row-between">
              <span class="pill-tag t-info">คำสั่งที่ ${o.orderNo}</span>
              <span style="font-size:11.5px;color:var(--secondary)">${o.date}</span>
            </div>
            <div class="item-title" style="margin-top:4px">${o.title}</div>
            <div class="item-meta">ผู้รับผิดชอบ: ${o.owner}${o.fileUrl ? ` • <a href="${o.fileUrl}" target="_blank" rel="noopener">เปิดไฟล์แนบ ↗</a>` : ""}</div>
          </div>`).join("") : `<div class="card" style="text-align:center;color:var(--secondary)">ยังไม่มีคำสั่งโรงเรียน — กด "+ ออกเลขคำสั่งใหม่" เพื่อรันเลขที่ 1/${new Date().getFullYear() + 543}</div>`}`;
    }

    function renderRoster() {
      const r = state.data.roster;
      $("mainArea").innerHTML = `
        <div class="action-bar">
          <a href="./attendance.html" class="btn-primary" style="text-decoration:none">📋 เปิดสมุดรายงานครูเวรประจำวัน ↗</a>
        </div>
        <div class="card">
          <div class="item-title" style="margin-bottom:8px">ตารางครูเวรประจำวัน (กลางวัน) & เวรยามรักษาการณ์</div>
          ${[["Mon", "วันจันทร์"], ["Tue", "วันอังคาร"], ["Wed", "วันพุธ"], ["Thu", "วันพฤหัสบดี"], ["Fri", "วันศุกร์"]].map(([k, lb]) => `
            <label class="lbl">${lb}</label>
            <input class="field" id="ros_${k}" value="${r[k] || ""}" />
          `).join("")}
          <label class="lbl">เวรยามรักษาการณ์ (กลางคืน / วันหยุด)</label>
          <input class="field" id="ros_night" value="${r.nightGuard || ""}" />
          <div class="item-meta" style="margin-bottom:10px">การตรวจเวรล่าสุดโดย ผอ.: <strong>${r.lastCheck || "ยังไม่บันทึก"}</strong></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn-primary" id="saveRosterBtn" style="flex:1">💾 บันทึกตารางเวร</button>
            ${me.role === "director" || me.role === "admin" ? `<button type="button" class="btn-green" id="dirCheckRosterBtn">✓ ลงนามตรวจเวรวันนี้</button>` : ""}
          </div>
        </div>`;
    }

    function renderCerts() {
      $("mainArea").innerHTML = `
        <div class="action-bar">
          <button type="button" class="btn-primary" id="addCertBtn">+ ขอหนังสือรับรอง</button>
          <button type="button" class="btn-soft" id="pdfCertsBtn">📤 Export PDF ทะเบียนคุม</button>
        </div>
        ${state.data.certs.length ? state.data.certs.map((c) => `
          <div class="card">
            <div class="row-between">
              <span class="pill-tag t-info">เลขที่ ${c.certNo} • ${c.kind}</span>
              <span class="pill-tag ${c.status === "ออกเอกสารแล้ว" ? "t-ok" : "t-warn"}">${c.status}</span>
            </div>
            <div class="item-title" style="margin-top:4px">${c.forName}</div>
            <div class="item-meta">วัตถุประสงค์: ${c.purpose} • วันที่ ${c.date} (ผู้ขอ: ${c.by})</div>
            ${isStaffAdmin && c.status !== "ออกเอกสารแล้ว" ? `<button type="button" class="btn-green" data-done-cert="${c.id}" style="margin-top:8px;padding:6px 10px">✓ ทำเครื่องหมายว่าออกเอกสารแล้ว</button>` : ""}
          </div>`).join("") : `<div class="card" style="text-align:center;color:var(--secondary)">ยังไม่มีรายการขอหนังสือรับรอง (ปพ.7 / รับรองเงินเดือน)</div>`}`;
    }

    function renderAssets() {
      $("mainArea").innerHTML = `
        <div class="action-bar">
          <button type="button" class="btn-primary" id="addAssetBtn">+ เพิ่มครุภัณฑ์</button>
          <button type="button" class="btn-soft" id="pdfAssetsBtn">📤 Export PDF ทะเบียนครุภัณฑ์</button>
        </div>
        ${state.data.assets.map((a) => `
          <div class="card">
            <div class="row-between">
              <div>
                <div class="item-title">${a.name}</div>
                <div class="item-meta">รหัส: ${a.code} • ห้อง: ${a.room}${a.borrower ? `<br/>ผู้ยืมปัจจุบัน: <strong>${a.borrower}</strong>` : ""}</div>
              </div>
              <span class="pill-tag ${a.status === "ว่าง" ? "t-ok" : "t-warn"}">${a.status}</span>
            </div>
            <div style="margin-top:8px;display:flex;gap:6px">
              ${a.status === "ว่าง"
                ? `<button type="button" class="btn-primary" data-borrow="${a.id}" style="padding:6px 11px">ยืมอุปกรณ์นี้</button>`
                : `<button type="button" class="btn-green" data-return="${a.id}" style="padding:6px 11px">✓ คืนอุปกรณ์แล้ว</button>`}
            </div>
          </div>`).join("")}`;
    }

    function renderTransfers() {
      $("mainArea").innerHTML = `
        <div class="action-bar">
          <button type="button" class="btn-primary" id="addTransBtn">+ บันทึกย้ายเข้า / ย้ายออก</button>
          <button type="button" class="btn-soft" id="pdfTransBtn">📤 Export PDF ทะเบียนย้าย</button>
        </div>
        ${state.data.transfers.length ? state.data.transfers.map((t) => `
          <div class="card">
            <div class="row-between">
              <span class="pill-tag ${t.kind === "ย้ายเข้า" ? "t-ok" : "t-warn"}">${t.kind} • ชั้น ${t.grade}</span>
              <span style="font-size:11.5px;color:var(--secondary)">${t.date}</span>
            </div>
            <div class="item-title" style="margin-top:4px">${t.stuName}</div>
            <div class="item-meta">${t.kind === "ย้ายเข้า" ? "มาจาก" : "ย้ายไป"}: ${t.school} • เลขที่ส่งตัว/ปพ.1: ${t.docNo || "-"}</div>
          </div>`).join("") : `<div class="card" style="text-align:center;color:var(--secondary)">ยังไม่มีประวัตินักเรียนย้ายเข้า / ย้ายออก</div>`}`;
    }

    function renderVisitors() {
      const pendingLeaves = (() => { try { return JSON.parse(localStorage.getItem("bpp_connect_leaves_v1") || "[]").filter((x) => x.status === "pending").length; } catch (_) { return 0; } })();
      const pendingCerts = state.data.certs.filter((c) => c.status !== "ออกเอกสารแล้ว").length;
      $("mainArea").innerHTML = `
        <div class="kpi-3">
          <div class="kpi-box"><strong>${pendingLeaves}</strong><span>ใบลารอ ผอ.อนุมัติ</span></div>
          <div class="kpi-box"><strong>${pendingCerts}</strong><span>หนังสือรับรองรอออก</span></div>
          <div class="kpi-box"><strong>${state.data.visitors.length}</strong><span>ผู้มาติดต่อทั้งหมด</span></div>
        </div>
        <div class="action-bar">
          <button type="button" class="btn-primary" id="addVisBtn">+ ลงนามผู้มาติดต่อราชการ</button>
          <button type="button" class="btn-soft" id="pdfVisBtn">📤 Export PDF สมุดลงนาม</button>
        </div>
        ${state.data.visitors.length ? state.data.visitors.map((v) => `
          <div class="card">
            <div class="row-between">
              <div class="item-title">${v.name}</div>
              <span style="font-size:11.5px;color:var(--secondary)">${v.date} (${v.timeIn})</span>
            </div>
            <div class="item-meta">หน่วยงาน: ${v.org}<br/>เรื่องที่มาติดต่อ: ${v.purpose}</div>
          </div>`).join("") : `<div class="card" style="text-align:center;color:var(--secondary)">ยังไม่มีบันทึกผู้มาติดต่อราชการ</div>`}`;
    }

    function render() {
      const av = me.avatar ? `<img class="mini-avatar" src="${me.avatar}" alt="" />` : "";
      $("userSub").innerHTML = `${av}<span>${me.shortName} • ${me.position || "บุคลากร"}</span>`;
      const titles = {
        hub: "ระบบธุรการโรงเรียน",
        orders: "ทะเบียนคำสั่ง & ประกาศโรงเรียน",
        roster: "ตารางครูเวร & เวรยามรักษาการณ์",
        certs: "ทะเบียนขอหนังสือรับรอง (ปพ.7)",
        assets: "ครุภัณฑ์ & ยืม–คืนอุปกรณ์",
        transfers: "ทะเบียนนักเรียนเข้าใหม่ / ย้ายออก",
        visitors: "สมุดผู้มาติดต่อ & แดชบอร์ด ผอ."
      };
      $("pageTitle").textContent = titles[state.view] || "ระบบธุรการโรงเรียน";
      $("backHubBtn").classList.toggle("hidden", state.view === "hub");

      if (state.view === "hub") renderHub();
      else if (state.view === "orders") renderOrders();
      else if (state.view === "roster") renderRoster();
      else if (state.view === "certs") renderCerts();
      else if (state.view === "assets") renderAssets();
      else if (state.view === "transfers") renderTransfers();
      else renderVisitors();
    }

    $("backHubBtn").onclick = () => { state.view = "hub"; render(); };

    $("mainArea").addEventListener("click", (e) => {
      const mod = e.target.closest("[data-mod]");
      if (mod) {
        if (mod.dataset.mod === "docs") { location.href = "./docs.html"; return; }
        if (mod.dataset.mod === "leave") { location.href = "./leave.html"; return; }
        state.view = mod.dataset.mod; render(); return;
      }

      if (e.target.id === "addOrderBtn") {
        const yr = new Date().getFullYear() + 543;
        const nextNo = `${state.data.orders.length + 1}/${yr}`;
        openSheet(`
          <h3>📜 ออกเลขคำสั่งโรงเรียนใหม่</h3>
          <label class="lbl">เลขที่คำสั่ง</label><input class="field" id="oNo" value="${nextNo}" />
          <label class="lbl">เรื่อง</label><input class="field" id="oTitle" placeholder="เช่น แต่งตั้งคณะกรรมการจัดกิจกรรม..." />
          <label class="lbl">ผู้รับผิดชอบ</label><input class="field" id="oOwner" value="${me.name}" />
          <label class="lbl">ลิงก์ไฟล์ PDF (ถ้ามี)</label><input class="field" id="oUrl" placeholder="https://drive.google.com/..." />
          <button type="button" class="btn-primary" id="saveOBtn" style="width:100%">บันทึกออกเลขคำสั่ง</button>
        `);
        $("saveOBtn").onclick = () => {
          const title = $("oTitle").value.trim(); if (!title) { showToast("กรุณากรอกเรื่องคำสั่ง"); return; }
          state.data.orders.unshift({ id: "ord-" + Date.now(), orderNo: $("oNo").value.trim() || nextNo, title, owner: $("oOwner").value.trim(), fileUrl: $("oUrl").value.trim(), date: new Date().toLocaleDateString("th-TH") });
          saveData(); closeSheet(); showToast(`ออกเลขคำสั่งที่ ${nextNo} แล้ว`); render();
        };
        return;
      }

      if (e.target.id === "saveRosterBtn") {
        state.data.roster = {
          ...state.data.roster,
          Mon: $("ros_Mon").value.trim(), Tue: $("ros_Tue").value.trim(), Wed: $("ros_Wed").value.trim(),
          Thu: $("ros_Thu").value.trim(), Fri: $("ros_Fri").value.trim(), nightGuard: $("ros_night").value.trim()
        };
        saveData(); showToast("บันทึกตารางเวรเรียบร้อยแล้ว"); return;
      }
      if (e.target.id === "dirCheckRosterBtn") {
        state.data.roster.lastCheck = `${new Date().toLocaleString("th-TH")} โดย ${me.shortName}`;
        saveData(); showToast("ลงนามตรวจเวรวันนี้เรียบร้อย"); render(); return;
      }

      if (e.target.id === "addCertBtn") {
        const yr = new Date().getFullYear() + 543;
        const nextNo = `${state.data.certs.length + 1}/${yr}`;
        openSheet(`
          <h3>🎓 ขอออกหนังสือรับรอง</h3>
          <label class="lbl">ประเภทเอกสาร</label>
          <select class="select-field" id="cKind"><option>ปพ.7 (รับรองความเป็นนักเรียน)</option><option>หนังสือรับรองเงินเดือน/ปฏิบัติงาน</option><option>หนังสือส่งตัว</option></select>
          <label class="lbl">ชื่อ-นามสกุล (นักเรียนหรือครู)</label><input class="field" id="cName" />
          <label class="lbl">วัตถุประสงค์ในการนำไปใช้</label><input class="field" id="cPurp" placeholder="เช่น สมัครเรียนต่อ / ยื่นธนาคาร" />
          <button type="button" class="btn-primary" id="saveCBtn" style="width:100%">ส่งคำขอถึงธุรการ</button>
        `);
        $("saveCBtn").onclick = () => {
          const forName = $("cName").value.trim(); if (!forName) { showToast("กรุณากรอกชื่อ-นามสกุล"); return; }
          state.data.certs.unshift({ id: "ct-" + Date.now(), certNo: nextNo, kind: $("cKind").value, forName, purpose: $("cPurp").value.trim() || "-", date: new Date().toLocaleDateString("th-TH"), status: "รอดำเนินการ", by: me.shortName });
          saveData(); closeSheet(); showToast("ส่งคำขอหนังสือรับรองแล้ว"); render();
        };
        return;
      }
      const doneCert = e.target.closest("[data-done-cert]");
      if (doneCert) {
        state.data.certs = state.data.certs.map((c) => c.id === doneCert.dataset.doneCert ? { ...c, status: "ออกเอกสารแล้ว" } : c);
        saveData(); showToast("อัปเดตสถานะออกเอกสารแล้ว"); render(); return;
      }

      if (e.target.id === "addAssetBtn") {
        openSheet(`
          <h3>📦 เพิ่มรายการครุภัณฑ์</h3>
          <label class="lbl">รหัสครุภัณฑ์</label><input class="field" id="aCode" placeholder="เช่น ครุภัณฑ์-04" />
          <label class="lbl">ชื่ออุปกรณ์/ครุภัณฑ์</label><input class="field" id="aName" />
          <label class="lbl">สถานที่เก็บ/ห้อง</label><input class="field" id="aRoom" value="ห้องธุรการ" />
          <button type="button" class="btn-primary" id="saveABtn" style="width:100%">บันทึกครุภัณฑ์</button>
        `);
        $("saveABtn").onclick = () => {
          const name = $("aName").value.trim(); if (!name) return;
          state.data.assets.unshift({ id: "as-" + Date.now(), code: $("aCode").value.trim() || "-", name, room: $("aRoom").value.trim(), status: "ว่าง", borrower: "" });
          saveData(); closeSheet(); showToast("เพิ่มครุภัณฑ์แล้ว"); render();
        };
        return;
      }
      const brBtn = e.target.closest("[data-borrow]");
      if (brBtn) {
        state.data.assets = state.data.assets.map((a) => a.id === brBtn.dataset.borrow ? { ...a, status: "กำลังยืม", borrower: `${me.shortName} (${new Date().toLocaleDateString("th-TH")})` } : a);
        saveData(); showToast("บันทึกการยืมอุปกรณ์แล้ว"); render(); return;
      }
      const rtBtn = e.target.closest("[data-return]");
      if (rtBtn) {
        state.data.assets = state.data.assets.map((a) => a.id === rtBtn.dataset.return ? { ...a, status: "ว่าง", borrower: "" } : a);
        saveData(); showToast("บันทึกการคืนอุปกรณ์แล้ว"); render(); return;
      }

      if (e.target.id === "addTransBtn") {
        openSheet(`
          <h3>🔄 บันทึกนักเรียนย้ายเข้า / ย้ายออก</h3>
          <div class="row-2">
            <div><label class="lbl">ประเภท</label><select class="select-field" id="tKind"><option>ย้ายเข้า</option><option>ย้ายออก</option></select></div>
            <div><label class="lbl">ระดับชั้น</label><select class="select-field" id="tGrade"><option>อ.2</option><option>อ.3</option><option>ป.1</option><option>ป.2</option><option>ป.3</option><option>ป.4</option><option>ป.5</option><option>ป.6</option></select></div>
          </div>
          <label class="lbl">ชื่อ-นามสกุลนักเรียน</label><input class="field" id="tName" />
          <label class="lbl">โรงเรียนเดิม / โรงเรียนปลายทาง</label><input class="field" id="tSchool" />
          <label class="lbl">เลขที่หนังสือส่งตัว / ปพ.1</label><input class="field" id="tDoc" />
          <button type="button" class="btn-primary" id="saveTBtn" style="width:100%">บันทึกทะเบียนย้าย</button>
        `);
        $("saveTBtn").onclick = () => {
          const stuName = $("tName").value.trim(); if (!stuName) return;
          state.data.transfers.unshift({ id: "tr-" + Date.now(), kind: $("tKind").value, grade: $("tGrade").value, stuName, school: $("tSchool").value.trim() || "-", docNo: $("tDoc").value.trim(), date: new Date().toLocaleDateString("th-TH") });
          saveData(); closeSheet(); showToast("บันทึกทะเบียนย้ายนักเรียนแล้ว"); render();
        };
        return;
      }

      if (e.target.id === "addVisBtn") {
        openSheet(`
          <h3>🤝 สมุดลงนามผู้มาติดต่อราชการ</h3>
          <label class="lbl">ชื่อ-นามสกุลผู้มาติดต่อ</label><input class="field" id="vName" />
          <label class="lbl">หน่วยงาน / สังกัด</label><input class="field" id="vOrg" placeholder="เช่น สพป.นครราชสีมา เขต 4 / ผู้ปกครอง" />
          <label class="lbl">เรื่องที่มาติดต่อ</label><input class="field" id="vPurp" placeholder="เช่น นิเทศติดตาม / ติดต่อขอเอกสาร" />
          <button type="button" class="btn-primary" id="saveVisBtn" style="width:100%">บันทึกการลงนาม</button>
        `);
        $("saveVisBtn").onclick = () => {
          const name = $("vName").value.trim(); if (!name) return;
          const now = new Date();
          state.data.visitors.unshift({ id: "vs-" + Date.now(), name, org: $("vOrg").value.trim() || "-", purpose: $("vPurp").value.trim() || "-", date: now.toLocaleDateString("th-TH"), timeIn: now.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) });
          saveData(); closeSheet(); showToast("บันทึกผู้มาติดต่อราชการแล้ว"); render();
        };
        return;
      }

      // PDF Exports
      if (e.target.id === "pdfOrdersBtn") {
        exportTablePdf("ทะเบียนคุมคำสั่งและประกาศโรงเรียนบ้านป่าไผ่", ["เลขที่", "วันที่", "เรื่อง", "ผู้รับผิดชอบ"],
          state.data.orders.map((o) => `<tr><td>${o.orderNo}</td><td>${o.date}</td><td class="left">${o.title}</td><td>${o.owner}</td></tr>`).join("") || `<tr><td colspan="4">ยังไม่มีรายการ</td></tr>`);
      } else if (e.target.id === "pdfCertsBtn") {
        exportTablePdf("ทะเบียนคุมการออกหนังสือรับรอง (ปพ.7)", ["เลขที่", "วันที่", "ประเภท", "ชื่อ-สกุล", "สถานะ"],
          state.data.certs.map((c) => `<tr><td>${c.certNo}</td><td>${c.date}</td><td>${c.kind}</td><td class="left">${c.forName}</td><td>${c.status}</td></tr>`).join("") || `<tr><td colspan="5">ยังไม่มีรายการ</td></tr>`);
      } else if (e.target.id === "pdfAssetsBtn") {
        exportTablePdf("ทะเบียนครุภัณฑ์และการยืม-คืนอุปกรณ์โรงเรียน", ["รหัส", "รายการ", "ห้อง", "สถานะ", "ผู้ยืม"],
          state.data.assets.map((a) => `<tr><td>${a.code}</td><td class="left">${a.name}</td><td>${a.room}</td><td>${a.status}</td><td class="left">${a.borrower || "-"}</td></tr>`).join(""));
      } else if (e.target.id === "pdfTransBtn") {
        exportTablePdf("ทะเบียนนักเรียนย้ายเข้า-ย้ายออก", ["วันที่", "ประเภท", "ชั้น", "ชื่อ-นามสกุล", "โรงเรียน", "เลขส่งตัว"],
          state.data.transfers.map((t) => `<tr><td>${t.date}</td><td>${t.kind}</td><td>${t.grade}</td><td class="left">${t.stuName}</td><td class="left">${t.school}</td><td>${t.docNo || "-"}</td></tr>`).join("") || `<tr><td colspan="6">ยังไม่มีรายการ</td></tr>`);
      } else if (e.target.id === "pdfVisBtn") {
        exportTablePdf("สมุดลงนามผู้มาติดต่อราชการ โรงเรียนบ้านป่าไผ่", ["วันที่/เวลา", "ชื่อ-นามสกุล", "หน่วยงาน", "เรื่องที่มาติดต่อ"],
          state.data.visitors.map((v) => `<tr><td>${v.date} ${v.timeIn}</td><td class="left">${v.name}</td><td class="left">${v.org}</td><td class="left">${v.purpose}</td></tr>`).join("") || `<tr><td colspan="4">ยังไม่มีรายการ</td></tr>`);
      }
    });

    render();
    syncCloud();
  </script>
</body>
</html>

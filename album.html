<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BPP Album — คลังภาพกิจกรรมโรงเรียนบ้านป่าไผ่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F6FA;
      --surface: #FFFFFF;
      --glass: rgba(255, 255, 255, 0.82);
      --fill: rgba(118, 118, 128, 0.11);
      --border: rgba(28, 28, 30, 0.08);
      --text: #1C1C1E;
      --secondary: #6C6C70;
      --muted: #8E8E93;
      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.11);
      --danger: #FF3B30;
      --danger-soft: rgba(255, 59, 48, 0.11);
      --spring: cubic-bezier(0.32, 1.18, 0.56, 1);
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    [data-theme="dark"] {
      --bg: #0B0D12;
      --surface: #1C1C1E;
      --glass: rgba(24, 24, 28, 0.84);
      --fill: rgba(118, 118, 128, 0.24);
      --border: rgba(255, 255, 255, 0.09);
      --text: #F2F2F7;
      --secondary: #AEAEB2;
      --muted: #8E8E93;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans Thai", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      overscroll-behavior: none;
      overflow: hidden;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
    }

    /* Frosted Glass Apple-style Header (Locked at top) */
    .topbar {
      flex-shrink: 0;
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 0.5px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
      z-index: 20;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .topbar-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-sub {
      font-size: 11.5px;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 1px;
    }
    .mini-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent-soft);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: var(--accent);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s var(--spring), opacity 0.15s;
      flex-shrink: 0;
    }
    .btn-primary:active { transform: scale(0.94); opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }

    .btn-soft {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: var(--fill);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      height: 36px;
      padding: 0 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.18s var(--spring), background 0.15s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .btn-soft:active { transform: scale(0.95); }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: var(--danger-soft);
      color: var(--danger);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      height: 36px;
      padding: 0 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.18s var(--spring);
    }
    .btn-danger:active { transform: scale(0.95); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: var(--fill);
      color: var(--text);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s var(--spring);
    }
    .icon-btn:active { transform: scale(0.9); }

    /* Segmented Tabs (อัลบั้ม | ถังขยะ) */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 3px;
      border-radius: 11px;
      background: var(--fill);
      margin-top: 10px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s, box-shadow 0.2s;
    }
    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* Scrollable Body */
    .body-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 14px 16px calc(32px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }
    .body-scroll::-webkit-scrollbar { display: none; }

    /* Search */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 38px;
      border: none;
      background: var(--fill);
      color: var(--text);
      border-radius: 12px;
      padding: 0 12px 0 36px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* Shimmer Skeleton */
    .skeleton-card {
      height: 224px;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--fill) 25%, rgba(255,255,255,0.45) 50%, var(--fill) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      margin-bottom: 14px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* Album Cards (Apple Photos / LINE Album Collage) */
    .album-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .album-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
      transition: transform 0.22s var(--spring), box-shadow 0.2s;
      animation: fadeUp 0.34s var(--ease) both;
    }
    .album-card:active { transform: scale(0.98); }

    .collage {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 94px 94px;
      gap: 2px;
      background: var(--fill);
    }
    .collage-main { grid-row: 1 / 3; width: 100%; height: 100%; object-fit: cover; display: block; }
    .collage-sub { width: 100%; height: 100%; object-fit: cover; display: block; }
    .collage-empty {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .album-foot {
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .album-info { min-width: 0; }
    .album-name {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .album-sub {
      margin-top: 2px;
      font-size: 12px;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }

    /* Inside Album: Smooth Action Bar + 3-Col Photo Grid */
    .album-actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .album-actions-bar::-webkit-scrollbar { display: none; }

    .quality-toggle {
      display: inline-flex;
      background: var(--fill);
      border-radius: 10px;
      padding: 2px;
      flex-shrink: 0;
    }
    .q-btn {
      border: none;
      background: transparent;
      color: var(--secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .q-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .photo-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--fill);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      animation: fadeUp 0.28s var(--ease) both;
      transition: transform 0.18s var(--spring);
    }
    .photo-cell:active { transform: scale(0.95); }
    .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .select-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      background: rgba(0, 0, 0, 0.32);
      display: grid;
      place-items: center;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
    }
    .photo-cell.selected .select-check { background: var(--accent); }
    .photo-cell.selected img { opacity: 0.7; }

    /* Trash List */
    .trash-list {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      border: 0.5px solid var(--border);
    }
    .trash-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--border);
    }
    .trash-row:last-child { border-bottom: none; }
    .trash-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--fill);
      object-fit: cover;
      display: grid;
      place-items: center;
      color: var(--secondary);
      flex-shrink: 0;
    }
    .trash-info { flex: 1; min-width: 0; }
    .trash-info strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trash-info span { display: block; font-size: 11.5px; color: var(--secondary); margin-top: 2px; }

    /* Live Upload Process Panel */
    .upload-panel {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      animation: fadeUp 0.28s var(--spring) both;
    }
    .upload-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .upload-head strong { font-size: 13.5px; font-weight: 700; }
    .upload-count { font-size: 12.5px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
    .progress-track { width: 100%; height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; margin-bottom: 10px; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width 0.25s var(--ease); }
    .upload-queue { max-height: 170px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .q-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: var(--bg); font-size: 12px; }
    .q-thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; background: var(--fill); flex-shrink: 0; }
    .q-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-status { font-variant-numeric: tabular-nums; color: var(--muted); flex-shrink: 0; }
    .q-status.uploading { color: var(--accent); font-weight: 600; }
    .q-status.done { color: var(--secondary); }
    .q-status.error { color: var(--danger); }

    /* Smooth Spring Bottom Sheet */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border-radius: 26px 26px 0 0;
      padding: 10px 20px calc(26px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.36s var(--spring);
    }
    .backdrop.open .sheet { transform: translateY(0); }
    .grabber { width: 38px; height: 5px; border-radius: 999px; background: var(--fill); margin: 0 auto 14px; }
    .sheet h3 { margin: 0 0 12px; font-size: 16.5px; font-weight: 700; }
    .field {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      padding: 0 13px;
      font-family: inherit;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    .field:focus { border-color: var(--accent); }
    .sheet-actions { display: flex; flex-direction: column; gap: 8px; }
    .sheet-actions .btn-primary,
    .sheet-actions .btn-soft,
    .sheet-actions .btn-danger { width: 100%; height: 44px; border-radius: 14px; font-size: 14.5px; }

    /* Swipeable Full-Screen Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12, 12, 14, 0.96);
      backdrop-filter: blur(20px);
      color: #FFFFFF;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.22s ease;
    }
    .lightbox.open { display: flex; }
    .lb-top {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .lb-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }
    .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .lb-bottom {
      padding: 12px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .lb-btn {
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
    }

    .empty { text-align: center; padding: 48px 16px; color: var(--secondary); font-size: 14px; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      background: rgba(28, 28, 30, 0.92);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 999px;
      display: none;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { display: block; }
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-left">
          <button class="icon-btn hidden" id="backBtn" aria-label="กลับ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div style="min-width:0">
            <h1 class="topbar-title" id="topTitle">คลังภาพ BPP</h1>
            <div class="topbar-sub" id="topMeta">กำลังเชื่อมต่อ Google Drive</div>
          </div>
        </div>
        <button class="btn-primary" id="primaryActionBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span id="primaryActionLabel">สร้างอัลบั้ม</span>
        </button>
      </div>

      <div class="segmented" id="mainSegBar">
        <button type="button" class="seg-btn active" data-maintab="albums">อัลบั้มทั้งหมด</button>
        <button type="button" class="seg-btn" data-maintab="trash">ถังขยะ</button>
      </div>
    </header>

    <main class="body-scroll">
      <!-- Live Upload Progress Process Panel -->
      <section class="upload-panel hidden" id="uploadPanel" aria-live="polite">
        <div class="upload-head">
          <strong id="uploadHeading">กำลังเตรียมอัปโหลด</strong>
          <span class="upload-count" id="uploadCounter">0 / 0 รูป (0%)</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="uploadBar"></div></div>
        <div class="upload-queue" id="uploadQueue"></div>
      </section>

      <!-- View 1: Album List -->
      <section id="albumsView">
        <div class="search-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="albumSearch" class="search-input" type="search" placeholder="ค้นหาอัลบั้มกิจกรรม..." />
        </div>
        <div class="album-list" id="albumList"></div>
      </section>

      <!-- View 2: Trash -->
      <section id="trashView" class="hidden">
        <div id="trashList"></div>
      </section>

      <!-- View 3: Photos Inside Album -->
      <section id="photosView" class="hidden">
        <div class="album-actions-bar">
          <div class="quality-toggle" role="group" aria-label="คุณภาพรูป">
            <button type="button" class="q-btn active" data-quality="standard">มาตรฐาน 1600px</button>
            <button type="button" class="q-btn" data-quality="original">ต้นฉบับ</button>
          </div>
          <button type="button" class="btn-soft" id="downloadZipBtn">โหลดทั้งอัลบั้ม (ZIP)</button>
          <button type="button" class="btn-soft" id="selectModeBtn">เลือกหลายรูป</button>
          <button type="button" class="btn-danger hidden" id="deleteSelectedBtn">ลบ (0)</button>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
      </section>
    </main>

    <input type="file" id="photoPicker" accept="image/*" multiple class="hidden" />
  </div>

  <!-- Spring Bottom Sheet -->
  <div class="backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="grabber"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <!-- Swipeable Full-Screen Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lb-top">
      <button type="button" class="lb-btn" id="lbClose">ปิด</button>
      <span id="lbCounter">1 / 1</span>
      <button type="button" class="lb-btn" id="lbDelete" style="color:#FF6961">ลบรูป</button>
    </div>
    <div class="lb-stage" id="lbStage"><img id="lbImg" src="" alt="" /></div>
    <div class="lb-bottom">
      <button type="button" class="lb-btn" id="lbPrev">ก่อนหน้า</button>
      <a class="lb-btn" id="lbDownload" target="_blank" rel="noopener">ดาวน์โหลด</a>
      <button type="button" class="lb-btn" id="lbNext">ถัดไป</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./apps-config.js"></script>
  <script>
    // Inherit Dark Mode & Accent Color from BPP Connect automatically
    const savedTheme = localStorage.getItem("bpp_connect_theme_v1") || "light";
    const savedAccent = localStorage.getItem("bpp_connect_accent_v1") || "#007AFF";
    document.documentElement.dataset.theme = savedTheme;
    document.documentElement.style.setProperty("--accent", savedAccent);

    // Automatically read the logged-in teacher from BPP Connect (zero manual name typing!)
    function getLoggedInTeacher() {
      const uid = localStorage.getItem("bpp_connect_user_v1");

    async function callApi(action, payload = {}) {
      const apiUrl = getAlbumApiUrl();
      if (!apiUrl) throw new Error("ยังไม่ได้เชื่อมลิงก์ BPP Album API");
      if (action === "listAlbums" || action === "listTrash") {
        const r = await fetch(`${apiUrl}?action=${action}`, { cache: "no-store" });
        return r.json();
      }
      if (action === "listPhotos") {
        const r = await fetch(`${apiUrl}?action=listPhotos&folderId=${encodeURIComponent(payload.folderId)}`, { cache: "no-store" });
        return r.json();
      }
      const r = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action, ...payload })
      });
      const json = await r.json();
      if (json && json.ok === false) throw new Error(json.error || "เกิดข้อผิดพลาด");
      return json;
    }

    // --- Sequential Unlimited Upload with Live Process ---
    function prepareImage(file, qualityMode) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const dataUrl = reader.result;
          if (qualityMode === "original") {
            resolve({ base64: String(dataUrl).split(",")[1], mime: file.type || "image/jpeg", preview: dataUrl });
            return;
          }
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const maxDim = 1600;
            const scale = Math.max(img.width, img.height) > maxDim ? maxDim / Math.max(img.width, img.height) : 1;
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            const outUrl = c.toDataURL("image/jpeg", 0.82);
            resolve({ base64: outUrl.split(",")[1], mime: "image/jpeg", preview: outUrl });
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function makeTinyCover(previewUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 560;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.65));
        };
        img.onerror = () => resolve("");
        img.src = previewUrl;
      });
    }

    async function handleMultiUpload(fileList) {
      const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
      if (!files.length || !state.currentAlbum) return;

      state.uploading = true;
      $("primaryActionBtn").disabled = true;
      $("uploadPanel").classList.remove("hidden");

      const queueItems = files.map((f) => ({ file: f, status: "รอคิว", cls: "", thumb: "" }));

      function renderQueue(doneCount) {
        const total = queueItems.length;
        const pct = Math.round((doneCount / total) * 100);
        $("uploadHeading").textContent = doneCount < total ? `กำลังอัปโหลดโดย ${currentTeacher.shortName}` : "อัปโหลดเสร็จสมบูรณ์";
        $("uploadCounter").textContent = `${doneCount} / ${total} รูป (${pct}%)`;
        $("uploadBar").style.width = `${pct}%`;
        $("uploadQueue").innerHTML = queueItems.map((it) => `
          <div class="q-row">
            ${it.thumb ? `<img class="q-thumb" src="${it.thumb}" alt="" />` : `<div class="q-thumb"></div>`}
            <span class="q-name">${it.file.name}</span>
            <span class="q-status ${it.cls}">${it.status}</span>
          </div>
        `).join("");
      }

      renderQueue(0);
      let successCount = 0;
      let firstCover = "";

      for (let i = 0; i < queueItems.length; i++) {
        const item = queueItems[i];
        item.status = "กำลังย่อรูป";
        item.cls = "uploading";
        renderQueue(i);

        let uploaded = false;
        for (let attempt = 1; attempt <= 2 && !uploaded; attempt++) {
          try {
            const prepared = await prepareImage(item.file, state.quality);
            item.thumb = prepared.preview;
            item.status = attempt === 1 ? "กำลังอัปโหลด" : "ลองใหม่";
            renderQueue(i);

            const res = await callApi("uploadPhoto", {
              folderId: state.currentAlbum.id,
              fileName: item.file.name,
              mimeType: prepared.mime,
              base64Data: prepared.base64
            });
            if (res && res.photo) {
              state.photos.unshift(res.photo);
              renderPhotos();
              if (!firstCover) firstCover = await makeTinyCover(prepared.preview);
            }
            item.status = "สำเร็จ";
            item.cls = "done";
            successCount++;
            uploaded = true;
          } catch (_) {
            if (attempt === 2) { item.status = "ไม่สำเร็จ"; item.cls = "error"; }
          }
        }
        renderQueue(i + 1);
      }

      if (successCount > 0) {
        $("uploadHeading").textContent = "กำลังส่งแจ้งเตือนเข้า BPP Connect...";
        try {
          await callApi("notifyBppConnect", {
            albumName: state.currentAlbum.name,
            uploadedCount: successCount,
            uploaderName: currentTeacher.name,
            coverDataUrl: firstCover
          });
          $("uploadHeading").textContent = `อัปโหลดสำเร็จ ${successCount} รูป และแจ้งเตือนแล้ว`;
          showToast(`อัปโหลด ${successCount} รูป และแจ้งเตือน BPP Connect แล้ว`);
          // Immediately notify parent BPP Connect shell to refresh Bell Badge & News!
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: "BPP_ALBUM_UPLOADED",
              albumName: state.currentAlbum.name,
              count: successCount
            }, location.origin);
          }
        } catch (_) {
          $("uploadHeading").textContent = `อัปโหลดสำเร็จ ${successCount} รูป`;
        }
      }

      state.uploading = false;
      $("primaryActionBtn").disabled = false;
      setTimeout(() => { if (!state.uploading) $("uploadPanel").classList.add("hidden"); }, 4500);
    }

    // --- Lightbox + Swipe Support ---

    function updateLightbox() {
      const p = state.photos[state.lbIndex];
      if (!p) { $("lightbox").classList.remove("open"); return; }
      $("lbImg").src = p.full;
      $("lbCounter").textContent = `${state.lbIndex + 1} / ${state.photos.length}`;
      $("lbDownload").href = p.downloadUrl;
    }

    let swipeStartX = 0;
    $("lbStage").addEventListener("touchstart", (e) => { swipeStartX = e.touches[0].clientX; }, { passive: true });
    $("lbStage").addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - swipeStartX;
      if (dx < -45 && state.lbIndex < state.photos.length - 1) { state.lbIndex++; updateLightbox(); }
      else if (dx > 45 && state.lbIndex > 0) { state.lbIndex--; updateLightbox(); }
    }, { passive: true });

    });

    $("trashList").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-restore-id]");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "กำลังกู้คืน...";
      try {
        await callApi("restoreTrash", { id: btn.dataset.restoreId, itemType: btn.dataset.restoreType });
        state.trashItems = state.trashItems.filter((x) => x.id !== btn.dataset.restoreId);
        renderTrash();
        showToast("กู้คืนรายการเรียบร้อยแล้ว");
      } catch (err) { showToast(err.message); }
    });

    $("albumList").addEventListener("click", (e) => {
      const menuBtn = e.target.closest("[data-album-menu]");
      if (menuBtn) {
        e.stopPropagation();
        const a = state.albums.find((x) => x.id === menuBtn.dataset.albumMenu);
        if (a) openAlbumMenu(a);
        return;
      }
      const card = e.target.closest("[data-open-album]");
      if (card) {
        const a = state.albums.find((x) => x.id === card.dataset.openAlbum);
        if (a) openAlbum(a);
      }
    });

    $("downloadZipBtn").onclick = () => {
      if (state.currentAlbum) downloadWholeAlbum(state.currentAlbum);
    };

    document.querySelectorAll(".q-btn").forEach((btn) => {
      btn.onclick = () => {
        state.quality = btn.dataset.quality;
        document.querySelectorAll(".q-btn").forEach((b) => b.classList.toggle("active", b === btn));
      };
    });

    $("selectModeBtn").onclick = () => {
      state.selectMode = !state.selectMode;
      state.selectedIds.clear();
      updateSelectToolbar();
      renderPhotos();
    };

    $("deleteSelectedBtn").onclick = async () => {
      const ids = [...state.selectedIds];
      if (!ids.length) return;
      $("deleteSelectedBtn").disabled = true;
      try {
        await callApi("deletePhotos", { fileIds: ids });
        state.photos = state.photos.filter((p) => !state.selectedIds.has(p.id));
        state.selectedIds.clear();
        state.selectMode = false;
        updateSelectToolbar();
        renderPhotos();
        showToast(`ย้ายรูป ${ids.length} รูป ไปถังขยะแล้ว`);
      } catch (err) { showToast(err.message); }
      $("deleteSelectedBtn").disabled = false;
    };

    $("photoGrid").addEventListener("click", (e) => {
      const cell = e.target.closest(".photo-cell");
      if (!cell) return;
      const id = cell.dataset.photoId;
      const idx = Number(cell.dataset.photoIdx);
      if (state.selectMode) {
        if (state.selectedIds.has(id)) state.selectedIds.delete(id);
        else state.selectedIds.add(id);
        updateSelectToolbar();
        renderPhotos();
      } else {
        openLightbox(idx);
      }
    });

    $("lbClose").onclick = () => $("lightbox").classList.remove("open");
    $("lbPrev").onclick = () => { if (state.lbIndex > 0) { state.lbIndex--; updateLightbox(); } };
    $("lbNext").onclick = () => { if (state.lbIndex < state.photos.length - 1) { state.lbIndex++; updateLightbox(); } };
    $("lbDelete").onclick = async () => {
      const p = state.photos[state.lbIndex];
      if (!p) return;
      try {
        await callApi("deletePhotos", { fileIds: [p.id] });
        state.photos.splice(state.lbIndex, 1);
        if (state.lbIndex >= state.photos.length) state.lbIndex = Math.max(0, state.photos.length - 1);
        renderPhotos();
        updateLightbox();
        showToast("ย้ายรูปไปถังขยะแล้ว");
      } catch (err) { showToast(err.message); }
    };

    loadAlbums();
  </script>
</body>
</html>

plugins {
    id 'com.android.application'
}

android {
    namespace 'th.ac.banpaphai.bppconnect'
    compileSdk 34

    defaultConfig {
        applicationId "th.ac.banpaphai.bppconnect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.4.12"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

/* =========================================

.macos-wallpaper {

.ios-btn-primary {

  box-shadow: 0 4px 14px -3px rgba(0, 122, 255, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  transition: transform 150ms var(--apple-ease), box-shadow 180ms var(--apple-ease), filter 160ms ease;
}

.ios-btn-primary:hover {

}

.ios-btn-secondary {
  background: rgba(255, 255, 255, 0.85);

  border: 1px solid rgba(15, 23, 42, 0.1);
  border-radius: 11px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  transition: background-color 150ms var(--apple-ease), transform 140ms var(--apple-ease);
}

.ios-btn-secondary:hover {
  background: #ffffff;
}

.ios-btn-secondary:active {
  transform: scale(0.97);
}

/* Inputs */
.ios-input {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(15, 23, 42, 0.12);

  color: #1d1d1f;
  transition: border-color 160ms var(--apple-ease), box-shadow 160ms var(--apple-ease);
}

.ios-input:focus {
  outline: none;
  border-color: #007aff;
  box-shadow: 0 0 0 3.5px rgba(0, 122, 255, 0.16);

.ios-input:disabled {

  color: #6e6e73;
}

/* Smooth Apple Sheet & Page Animations */
@keyframes appleEnter {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.99);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-apple {
  animation: appleEnter 340ms var(--apple-ease) forwards;
}

@keyframes sheetPop {
  0% {
    opacity: 0;
    transform: translateY(16px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.animate-sheet {
  animation: sheetPop 280ms var(--apple-ease) forwards;
}

/* Smooth Progress Bar */
.ios-progress-fill {
  transition: width 650ms var(--apple-ease);
}

/* macOS Unlock Transition Overlay */
@keyframes unlockRingDraw {
  0% { stroke-dashoffset: 220; opacity: 0.2; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes unlockGlowBurst {
  0% { transform: scale(0.75); opacity: 0; }
  45% { transform: scale(1.15); opacity: 0.7; }
  100% { transform: scale(1.55); opacity: 0; }
}

@keyframes unlockProgress {
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}

@keyframes unlockExit {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.06); }
}

.unlock-ring-svg {
  stroke-dasharray: 220;
  stroke-dashoffset: 220;
  animation: unlockRingDraw 680ms var(--apple-ease) 120ms forwards;
}

.unlock-burst {
  animation: unlockGlowBurst 950ms var(--apple-ease) forwards;
}

.unlock-bar-fill {
  transform-origin: left center;
  animation: unlockProgress 850ms var(--apple-ease) 120ms forwards;
}

.unlock-overlay-exit {
  animation: unlockExit 340ms var(--apple-ease) forwards;
}

/* =========================================
   iOS 18 Dynamic Island, Switches, Dock,
   Control Center & Dark Mode
   ========================================= */

/* Dynamic Island */
#dynamic-island-root {
  position: fixed !important;
  top: 12px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  z-index: 11000 !important;
  pointer-events: none;
}

.dynamic-island {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  border-radius: 9999px;
  background: rgba(15, 15, 18, 0.92);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  color: #ffffff;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 14px 38px -8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  animation: islandPop 340ms var(--apple-spring) forwards;
}

@keyframes islandPop {
  0% { opacity: 0; transform: translateY(-14px) scale(0.76); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.island-spin {
  width: 15px;
  height: 15px;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin360 700ms linear infinite;
}

@keyframes spin360 {
  100% { transform: rotate(360deg); }
}

/* iOS Toggle Switch */
.ios-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 44px;
  height: 26px;
  border-radius: 9999px;
  background: rgba(120, 120, 128, 0.28);
  transition: background-color 220ms var(--apple-ease);
  cursor: pointer;
  flex-shrink: 0;
  border: none;
  padding: 2px;
}

.ios-switch[data-checked="true"] {
  background: #34c759;
}

.ios-switch-knob {
  width: 22px;
  height: 22px;
  border-radius: 9999px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  transform: translateX(0);
  transition: transform 240ms var(--apple-spring);
}

.ios-switch[data-checked="true"] .ios-switch-knob {
  transform: translateX(18px);
}

/* iOS Sheet Depth & Grabber */
#app {
  transition: transform 280ms var(--apple-ease), filter 280ms var(--apple-ease);
  transform-origin: center top;
}

body.modal-open #app {
  transform: scale(0.985);
}

.ios-grabber {
  width: 40px;
  height: 5px;
  border-radius: 9999px;
  background: rgba(60, 60, 67, 0.22);
  margin: 10px auto 2px;
}

.ios-bottom-dock {

  left: 12px !important;
  right: 12px !important;
  z-index: 45 !important;

      no: i,
      amount: i === 1 ? firstAmount : 0,
      date: i === 1 ? firstDate : '',
      note: '',
    });
  }
  return list;
}

// ============================================================
// Interactive Mouse-Reactive Shader Engine
// Uses WebGPU `shaders/js` when available, with silky-smooth
// 60fps Canvas Shader fallback that shifts color with mouse!
// ============================================================

(function () {
  let rafId = null;
  let pointer = { x: 0.5, y: 0.45, tx: 0.5, ty: 0.45 };
  let trail = [];
  let listenerBound = false;

  function bindPointer() {
    if (listenerBound) return;
    listenerBound = true;
    const update = (cx, cy) => {
      const w = window.innerWidth || 1;
      const h = window.innerHeight || 1;
      pointer.tx = Math.max(0, Math.min(1, cx / w));
      pointer.ty = Math.max(0, Math.min(1, cy / h));
      trail.push({ x: pointer.tx, y: pointer.ty, life: 1 });
      if (trail.length > 18) trail.shift();
    };
    window.addEventListener('pointermove', (e) => update(e.clientX, e.clientY), { passive: true });
    window.addEventListener(
      'touchmove',
      (e) => {
        if (e.touches && e.touches[0]) update(e.touches[0].clientX, e.touches[0].clientY);
      },
      { passive: true }
    );
  }

  function hsl(h, s, l, a) {
    return `hsla(${((h % 360) + 360) % 360}, ${s}%, ${l}%, ${a})`;
  }

  window.mountInteractiveShader = function mountInteractiveShader(canvasId, mode = 'login') {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    bindPointer();

    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    };
    resize();

    const onResize = () => {
      if (!document.body.contains(canvas)) {
        window.removeEventListener('resize', onResize);
        return;
      }
      resize();
    };
    window.addEventListener('resize', onResize);

    let t = 0;

    function frame() {
      if (!document.body.contains(canvas)) {
        rafId = null;
        return;
      }

      // Smooth spring interpolation toward cursor
      pointer.x += (pointer.tx - pointer.x) * 0.065;
      pointer.y += (pointer.ty - pointer.y) * 0.065;
      t += 0.008;

      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Hue shifts smoothly across the spectrum as mouse moves X & Y
      const baseHue = mode === 'login'
        ? 155 + pointer.x * 135 + pointer.y * 55 + Math.sin(t) * 14
        : 195 + pointer.x * 110 + pointer.y * 45 + Math.sin(t * 0.7) * 10;

      const alphaMain = mode === 'login' ? 0.42 : 0.16;
      const alphaSub = mode === 'login' ? 0.34 : 0.12;

      // Layer 1: Primary cursor-following mesh orb
      const cx1 = pointer.x * w;
      const cy1 = pointer.y * h;
      const r1 = Math.max(w, h) * (mode === 'login' ? 0.56 : 0.48);
      const g1 = ctx.createRadialGradient(cx1, cy1, 0, cx1, cy1, r1);
      g1.addColorStop(0, hsl(baseHue, 88, 62, alphaMain));
      g1.addColorStop(0.48, hsl(baseHue + 42, 82, 56, alphaMain * 0.55));
      g1.addColorStop(1, hsl(baseHue + 80, 75, 50, 0));
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, w, h);

      // Layer 2: Counter-drifting complementary aurora orb
      const cx2 = (1 - pointer.x * 0.7 + Math.sin(t * 0.9) * 0.08) * w;
      const cy2 = (1 - pointer.y * 0.7 + Math.cos(t * 0.7) * 0.08) * h;
      const r2 = Math.max(w, h) * 0.52;
      const g2 = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, r2);
      g2.addColorStop(0, hsl(baseHue + 125, 85, 60, alphaSub));
      g2.addColorStop(0.55, hsl(baseHue + 165, 80, 58, alphaSub * 0.45));
      g2.addColorStop(1, hsl(baseHue + 190, 70, 50, 0));
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, w, h);

      // Layer 3: Soft cursor shimmer trail (Login mode)
      if (mode === 'login' && trail.length > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = trail.length - 1; i >= 0; i--) {
          const pt = trail[i];
          pt.life -= 0.035;
          if (pt.life <= 0) {
            trail.splice(i, 1);
            continue;
          }
          const px = pt.x * w;
          const py = pt.y * h;
          const rad = Math.max(w, h) * 0.14 * pt.life;
          const gt = ctx.createRadialGradient(px, py, 0, px, py, rad);
          gt.addColorStop(0, hsl(baseHue + 25, 95, 76, 0.24 * pt.life));
          gt.addColorStop(1, hsl(baseHue + 55, 90, 65, 0));
          ctx.fillStyle = gt;
          ctx.beginPath();
          ctx.arc(px, py, rad, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);
  };
})();

    <script>
// ============================================================
// ระบบ E-Budget โรงเรียนบ้านป่าไผ่ (macOS / iOS Edition)
// สำนักงานเขตพื้นที่การศึกษาประถมศึกษานครราชสีมา เขต 4
// ============================================================

(function () {
  const STORAGE_KEY = 'banpaphai_ebudget_state_v1';
  const SESSION_KEY = 'banpaphai_ebudget_user_v1';
  const THEME_KEY = 'banpaphai_ebudget_dark_v1';

  let state = null;
  let currentUser = null;
  let selectedLoginUsername = null;
  let clockInterval = null;
  let islandTimer = null;
  let darkMode = false;
  let controlCenterOpen = false;
  let adminPreviewViewer = false;
  let activeTab = 'dashboard';
  let filters = {
    search: '',
    divisionId: 'all',
    onlyMine: false,
  };
  let charts = {
    bar: null,
    donut: null,
  };
  let mobileMenuOpen = false;

  // ==========================================================
  // Helpers & Formatters
  // ==========================================================
  function fmt(num) {
    const n = Number(num) || 0;
    return n.toLocaleString('th-TH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function fmtInt(num) {
    const n = Number(num) || 0;
    return n.toLocaleString('th-TH', { maximumFractionDigits: 0 });
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function sumDisbursements(item) {
    if (!item || !Array.isArray(item.disbursements)) return 0;
    return item.disbursements.reduce((acc, d) => acc + (Number(d.amount) || 0), 0);
  }

  function getRoleInfo(roleKey) {
    return window.EBUDGET_ROLES[roleKey] || window.EBUDGET_ROLES.viewer;
  }

  function getRoleColor(roleKey) {
    const map = {
      director: { bg: '#f3e8ff', text: '#7e22ce', dot: '#9333ea', grad: 'from-purple-500 to-indigo-600' },
      admin: { bg: '#ffe4e6', text: '#be123c', dot: '#e11d48', grad: 'from-rose-500 to-pink-600' },
      finance: { bg: '#dcfce7', text: '#15803d', dot: '#22c55e', grad: 'from-emerald-500 to-teal-600' },
      viewer: { bg: '#e0f2fe', text: '#0369a1', dot: '#0284c7', grad: 'from-sky-500 to-blue-600' },
    };
    return map[roleKey] || map.viewer;
  }

  function getEffectiveRole() {
    if (!currentUser) return window.EBUDGET_ROLES.viewer;
    if (currentUser.role === 'admin' && adminPreviewViewer) {
      return window.EBUDGET_ROLES.viewer;
    }
    return getRoleInfo(currentUser.role);
  }

  function canEditBudget() {
    return getEffectiveRole().canEditBudget;
  }

  function canAdminSystem() {
    return getEffectiveRole().canAdminSystem;
  }

  function getDivision(divId) {
    return (
      state.divisions.find((d) => d.id === divId) ||
      state.divisions[0] || {
        id: 'general',
        name: 'ทั่วไป',
        shortName: 'ทั่วไป',
        color: '#007aff',
        bgSoft: '#e0f2fe',
        textDark: '#0369a1',
        borderHex: '#bae6fd',
      }
    );
  }

  function getCurrentYearData() {
    if (!state.years[state.activeYear]) {
      const keys = Object.keys(state.years).sort();
      state.activeYear = keys[0] || '2570';
    }
    return state.years[state.activeYear];
  }

  function computeYearMetrics(yearData) {
    const inc = yearData.income;
    let totalStudents = 0;
    let perCapitaNew = 0;
    let activityNew = 0;

    (inc.grades || []).forEach((g) => {
      const s = Number(g.students) || 0;
      totalStudents += s;
      perCapitaNew += ((Number(g.baseRate) || 0) + (Number(g.extraRate) || 0)) * s;
      activityNew += (Number(g.activityRate) || 0) * s;
    });

    const perCapitaTotal = (Number(inc.perCapitaCarryOver) || 0) + perCapitaNew;
    const activityTotal = (Number(inc.activityCarryOver) || 0) + activityNew;
    const grandIncome = perCapitaTotal + activityTotal;

    const sumCat = (arr) => {
      let allocated = 0;
      let disbursed = 0;
      (arr || []).forEach((item) => {
        allocated += Number(item.allocated) || 0;
        disbursed += sumDisbursements(item);
      });
      return { allocated, disbursed, remaining: allocated - disbursed, count: (arr || []).length };
    };

    const projStats = sumCat(yearData.projects);
    const opStats = sumCat(yearData.operating);
    const actStats = sumCat(yearData.activities);
    const polStats = sumCat(yearData.policySubsidies);

    const coreAllocated = projStats.allocated + opStats.allocated + actStats.allocated;
    const coreDisbursed = projStats.disbursed + opStats.disbursed + actStats.disbursed;

    const totalAllocated = coreAllocated + polStats.allocated;
    const totalDisbursed = coreDisbursed + polStats.disbursed;
    const totalRemaining = totalAllocated - totalDisbursed;

    const divisionMap = {};
    state.divisions.forEach((d) => {
      divisionMap[d.id] = { division: d, allocated: 0, disbursed: 0, remaining: 0, count: 0 };
    });

    const allItems = [
      ...(yearData.projects || []),
      ...(yearData.operating || []),
      ...(yearData.activities || []),
      ...(yearData.policySubsidies || []),
    ];

    allItems.forEach((item) => {
      const divId = divisionMap[item.divisionId] ? item.divisionId : state.divisions[0].id;
      const alloc = Number(item.allocated) || 0;
      const disb = sumDisbursements(item);
      divisionMap[divId].allocated += alloc;
      divisionMap[divId].disbursed += disb;
      divisionMap[divId].remaining += alloc - disb;
      divisionMap[divId].count += 1;
    });

    return {
      totalStudents,
      perCapitaNew,
      perCapitaTotal,
      activityNew,
      activityTotal,
      grandIncome,
      projStats,
      opStats,
      actStats,
      polStats,
      coreAllocated,
      coreDisbursed,
      totalAllocated,
      totalDisbursed,
      totalRemaining,
      divisionStats: Object.values(divisionMap),
    };
  }

  function renderIcons(container) {
    if (!window.lucide) return;
    const opts = { attrs: { 'stroke-width': 1.75 } };
    if (container) opts.nodes = [container];
    lucide.createIcons(opts);
  }

  function getInitials(name) {
    const clean = (name || '')
      .replace(/^ผ\.อ\./, '')
      .replace(/^ครู/, '')
      .trim();
    return clean.slice(0, 2) || 'BP';
  }

  function getUserAvatarUrl(user) {
    const assets = window.EBUDGET_ASSETS || {};
    if (!user) return assets.avatarFemale || 'assets/avatar_female.jpg';
    if (user.role === 'director' || (user.name || '').includes('ผ.อ.')) {
      return assets.avatarDirector || 'assets/avatar_director.jpg';
    }
    if (
      user.username === 'thanakarin' ||
      user.username === 'phatcharasaran' ||
      user.username === 'nanthaphat' ||
      (user.name || '').includes('ธานครินทร์') ||
      (user.name || '').includes('พชรศรัณย์') ||
      (user.name || '').includes('นันทน์')
    ) {
      return assets.avatarMale || 'assets/avatar_male.jpg';
    }
    return assets.avatarFemale || 'assets/avatar_female.jpg';
  }

  function getLoginWallpaperUrl() {
    const assets = window.EBUDGET_ASSETS || {};
    return assets.loginWallpaper || 'assets/login_wallpaper.jpg';
  }

  // ==========================================================
  // Persistence (Google Apps Script -> Server API -> localStorage)
  // ==========================================================
  function isGAS() {
    return typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;
  }

  function gasCall(fnName, ...args) {
    return new Promise((resolve, reject) => {
      window.google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fnName](...args);
    });
  }

    function getBppNewsApiUrl() {
    try {
      return (localStorage.getItem('bpp_connect_news_api_v1') || (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.newsBackendUrl) || '').trim();
    } catch (_) { return ''; }
  }

  async function loadState() {
    const saved = safeGetStorage('local', STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.years) state = parsed;
      } catch (_) {}
    }
    if (!state || !state.years) {
      state = window.createInitialState();
      safeSetStorage('local', STORAGE_KEY, JSON.stringify(state));
    }
    // ซิงก์ข้อมูลล่าสุดจากคลาวด์ AppDataStore เบื้องหลังแบบไม่บล็อกหน้าจอ
    const apiUrl = getBppNewsApiUrl();
    if (apiUrl) {
      fetch(apiUrl + '?action=get_kv&key=bpp_ebudget_db_v1', { cache: 'no-store' })
        .then((r) => r.json())
        .then((json) => {
          if (json && json.ok && json.value && json.value.years) {
            const cloudTs = Number(json.value._updatedAt || 0);
            const localTs = Number((state && state._updatedAt) || 0);
            if (cloudTs > localTs) {
              state = json.value;
              safeSetStorage('local', STORAGE_KEY, JSON.stringify(state));
              restoreSession();
              if (typeof render === 'function') render();
            }
          }
        })
        .catch(() => {});
    }
  }

  async function saveState(silent = false) {
    state._updatedAt = Date.now();
    const serialized = JSON.stringify(state);
    try { localStorage.setItem(STORAGE_KEY, serialized); } catch (_) {}
    const apiUrl = getBppNewsApiUrl();
    if (apiUrl) {
      try {
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'save_kv', key: 'bpp_ebudget_db_v1', value: state })
        }).catch(() => {});
      } catch (_) {}
    }
    if (!silent) {
      showToast('บันทึกข้อมูลและซิงก์เรียบร้อยแล้ว', 'success');
    }
  }

  function safeGetStorage(kind, key) {
    try {
      const store = kind === 'session' ? window.sessionStorage : window.localStorage;
      return store ? store.getItem(key) : null;
    } catch (_) {
      return null;
    }
  }

  function safeSetStorage(kind, key, val) {
    try {
      const store = kind === 'session' ? window.sessionStorage : window.localStorage;
      if (store) store.setItem(key, val);
    } catch (_) {}
  }

  function safeRemoveStorage(kind, key) {
    try {
      const store = kind === 'session' ? window.sessionStorage : window.localStorage;
      if (store) store.removeItem(key);
    } catch (_) {}
  }

    function restoreSession() {
    // 1) ซิงก์โหมดมืดจาก BPP Connect อัตโนมัติ
    try {
      const bppTheme = localStorage.getItem('bpp_connect_theme_v1');
      if (bppTheme === 'dark' || bppTheme === 'light') {
        darkMode = bppTheme === 'dark';
        applyDarkMode();
      }
    } catch (_) {}

    // 2) อ่านผู้ใช้งานที่ล็อกอินอยู่ใน BPP Connect เข้าใช้งานทันที ไม่ต้องกรอกรหัสซ้ำ
    const bppUid = safeGetStorage('local', 'bpp_connect_user_v1');
    let bppUsers = (window.SCHOOL_CONFIG && window.SCHOOL_CONFIG.users) || [];
    try {
      const rawU = localStorage.getItem('bpp_connect_users_v3');
      if (rawU) {
        const parsedU = JSON.parse(rawU);
        if (Array.isArray(parsedU) && parsedU.length) bppUsers = parsedU;
      }
    } catch (_) {}
    const bppUser = bppUsers.find((u) => u.id === bppUid) || bppUsers[0];
    if (bppUser && state && state.users) {
      const usernameMap = {
        napaporn: 'napaporn',
        thanakarin: 'thanakarin',
        namphet: 'namphet',
        nantaphat: 'nanthaphat',
        narisara: 'narisara',
        pacharasaran: 'phatcharasaran'
      };
      const targetUsername = usernameMap[bppUser.id] || bppUser.id;
      let found = state.users.find((u) => u.username === targetUsername);
      if (!found) {
        found = {
          id: 'bpp-' + bppUser.id,
          name: bppUser.shortName || bppUser.name,
          position: bppUser.position || 'บุคลากรโรงเรียนบ้านป่าไผ่',
          username: bppUser.id,
          password: '',
          role: bppUser.role === 'admin' ? 'admin' : bppUser.role === 'director' ? 'director' : 'viewer',
          divisionId: 'general',
          dualRoleLabel: ''
        };
      }
      currentUser = found;
      safeSetStorage('session', SESSION_KEY, found.id);
      return;
    }

    const savedId = safeGetStorage('session', SESSION_KEY);
    if (savedId && state && state.users) {
      const found = state.users.find((u) => u.id === savedId);
      if (found) currentUser = found;
    }
  }

  // ==========================================================
  // iOS Dynamic Island Notification & Theme Helpers
  // ==========================================================
  function applyDarkMode() {
    document.body.classList.toggle('ios-dark', !!darkMode);
    safeSetStorage('local', THEME_KEY, darkMode ? '1' : '0');
  }

  function showToast(message, type = 'success') {
    const root = document.getElementById('dynamic-island-root');
    if (!root) return;
    if (islandTimer) {
      clearTimeout(islandTimer);

  function renderControlCenter() {

            ${isGAS() ? 'Google Sheet Live' : 'Local Mode'}
          </span>
        </div>

        <div class="p-3 rounded-2xl bg-black/[0.04]" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:${darkMode ? 'rgba(94,92,230,0.22)' : 'rgba(255,149,0,0.18)'};color:${darkMode ? '#bf5af2' : '#ff9500'};">
              <i data-lucide="${darkMode ? 'moon' : 'sun'}" class="w-4 h-4"></i>

            </div>

          <button type="button" id="cc-dark-toggle" class="ios-switch" data-checked="${darkMode ? 'true' : 'false'}" aria-label="สลับโหมดมืด">
            <span class="ios-switch-knob"></span>

        <div class="p-3 rounded-2xl bg-black/[0.04] space-y-1.5">

    renderIcons(root);

  function updateLockClock() {
    const timeEl = document.getElementById('ios-lock-time');
    const dateEl = document.getElementById('ios-lock-date');
    if (!timeEl || !dateEl) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    timeEl.textContent = `${hh}:${mm}`;
    dateEl.textContent = now.toLocaleDateString('th-TH', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric',
    });
  }

  function playLoginUnlockTransition(user, onComplete) {
    const rc = getRoleColor(user.role);
    const roleInfo = getRoleInfo(user.role);
    const avatarSrc = getUserAvatarUrl(user);

    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop-fixed';
    overlay.style.background = 'rgba(2, 6, 23, 0.68)';
    overlay.innerHTML = `
      <div class="relative flex flex-col items-center text-center px-8 py-10 rounded-[32px] ios-glass-dark max-w-sm w-[90%] animate-sheet">
        <div class="relative w-28 h-28 flex items-center justify-center mb-5">
          <div class="absolute inset-0 rounded-full unlock-burst" style="background: radial-gradient(circle, ${rc.dot}99 0%, transparent 70%);"></div>
          <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"></circle>
            <circle cx="40" cy="40" r="35" fill="none" stroke="#34c759" stroke-width="3.5" stroke-linecap="round" class="unlock-ring-svg"></circle>
          </svg>
          <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-white shadow-xl relative z-10">
            <img src="${avatarSrc}" alt="${esc(user.name)}" class="w-full h-full object-cover" />

          <div class="absolute -bottom-1 -right-1 z-20 w-8 h-8 rounded-full bg-[#34c759] text-white flex items-center justify-center shadow-lg border-2 border-white">
            <i data-lucide="check" class="w-4 h-4"></i>
          </div>
        </div>

        <p class="text-xs font-medium text-emerald-300 tracking-wide">ยืนยันตัวตนสำเร็จ</p>
        <h2 class="text-2xl font-bold text-white mt-1">ยินดีต้อนรับ ${esc(user.name)}</h2>
        <p class="text-xs text-white/75 mt-1">${esc(user.dualRoleLabel || roleInfo.label)}</p>

        <div class="w-48 h-1.5 rounded-full bg-white/20 overflow-hidden mt-6">
          <div class="h-full w-full rounded-full bg-gradient-to-r from-[#34c759] via-[#38bdf8] to-[#007aff] unlock-bar-fill"></div>
        </div>
        <p class="text-[11px] text-white/65 mt-2.5">กำลังเปิดระบบ E-Budget ปีการศึกษา ${esc(state.activeYear)}</p>
      </div>
    `;
    document.body.appendChild(overlay);
    renderIcons(overlay);

    setTimeout(() => {
      overlay.classList.add('unlock-overlay-exit');
      setTimeout(() => {
        overlay.remove();
        if (onComplete) onComplete();
      }, 320);
    }, 980);
  }

  function renderActiveTabHTML(yearData, metrics) {
    switch (activeTab) {
      case 'dashboard':
        return renderDashboardHTML(yearData, metrics);
      case 'income':
        return renderIncomeHTML(yearData, metrics);
      case 'projects':
        return renderBudgetTableHTML('projects', 'งบโครงการ (เงินอุดหนุนรายหัว)', yearData.projects, metrics.projStats);
      case 'operating':
        return renderBudgetTableHTML('operating', 'งบดำเนินงาน (รายจ่ายประจำ)', yearData.operating, metrics.opStats);
      case 'activities':
        return renderActivitiesAndPolicyHTML(yearData, metrics);

        return renderAdminHTML();

  // ==========================================================
  // TAB 3 & 4: Budget Tables with iOS Segmented Controls
  // ==========================================================
  function renderBudgetTableHTML(sectionKey, title, items, stats) {
    const editable = canEditBudget();
    const isOperating = sectionKey === 'operating';

    const filtered = (items || []).filter((item) => {
      if (filters.divisionId !== 'all' && item.divisionId !== filters.divisionId) return false;
      if (filters.onlyMine && item.responsible && !item.responsible.includes(currentUser.name)) return false;
      if (filters.search) {
        const q = filters.search.toLowerCase();
        const hit =
          (item.name || '').toLowerCase().includes(q) ||
          (item.responsible || '').toLowerCase().includes(q) ||
          (item.category || '').toLowerCase().includes(q);
        if (!hit) return false;
      }
      return true;
    });

    const divisionChips = [
      `<button data-filter-div="all" class="ios-seg-btn px-3 py-1.5 text-xs font-semibold ${
        filters.divisionId === 'all' ? 'ios-seg-active' : 'text-[#515154] hover:text-[#1d1d1f]'
      }">ทุกฝ่าย</button>`,
      ...state.divisions.map((d) => {
        const active = filters.divisionId === d.id;
        return `
          <button data-filter-div="${d.id}" class="ios-seg-btn px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1.5 ${
            active ? 'ios-seg-active' : 'text-[#515154] hover:text-[#1d1d1f]'
          }">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${d.color}"></span>
            <span>${esc(d.shortName)}</span>
          </button>
        `;
      }),
    ].join('');

    const rowsHTML =
      filtered.length === 0
        ? `<tr><td colspan="7" class="py-12 text-center text-[#86868b] text-sm">ไม่พบรายการที่ตรงกับเงื่อนไข</td></tr>`
        : filtered
            .map((item, i) => {
              const div = getDivision(item.divisionId);
              const disb = sumDisbursements(item);
              const rem = (Number(item.allocated) || 0) - disb;
              const pct = item.allocated > 0 ? Math.min(100, (disb / item.allocated) * 100) : 0;
              const usedCount = (item.disbursements || []).filter((d) => Number(d.amount) > 0).length;

              return `
                <tr class="border-b border-black/[0.05] last:border-0 hover:bg-black/[0.02] transition">
                  <td class="py-3.5 px-5">
                    <div class="flex items-start gap-3">
                      <span class="w-1.5 self-stretch rounded-full shrink-0 mt-0.5" style="background:${div.color}"></span>
                      <div class="min-w-0">
                        <p class="text-[13.5px] font-semibold text-[#1d1d1f] leading-snug"><span class="text-[#86868b] num mr-1">${i + 1}.</span>${esc(item.name)}</p>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold" style="background:${div.bgSoft}; color:${div.textDark};">
                            <span class="w-1.5 h-1.5 rounded-full" style="background:${div.color}"></span>
                            ${esc(div.shortName)}
                          </span>
                          ${
                            usedCount > 0
                              ? `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 num">เบิกแล้ว ${usedCount} ครั้ง</span>`
                              : ''
                          }
                        </div>
                      </div>
                    </div>
                  </td>
                  <td class="py-3.5 px-3 text-xs font-medium text-[#515154] whitespace-nowrap">
                    ${isOperating ? esc(item.category || '-') : esc(item.responsible || '-')}
                  </td>
                  <td class="py-3.5 px-3 text-right text-xs text-[#86868b] num whitespace-nowrap hidden xl:table-cell">
                    ${fmt(item.allocated2569 || 0)}
                  </td>
                  <td class="py-3.5 px-3 text-right text-[13.5px] font-semibold text-[#1d1d1f] num whitespace-nowrap">
                    ${fmt(item.allocated)}
                  </td>
                  <td class="py-3.5 px-3 text-right text-[13.5px] font-semibold text-[#ff9500] num whitespace-nowrap">
                    ${fmt(disb)}
                  </td>
                  <td class="py-3.5 px-3 text-right text-[13.5px] font-semibold ${rem < 0 ? 'text-[#ff3b30]' : 'text-[#28a745]'} num whitespace-nowrap">
                    ${fmt(rem)}
                    <div class="w-24 h-1.5 rounded-full bg-black/[0.06] overflow-hidden ml-auto mt-1">
                      <div class="h-full rounded-full" style="width:${pct.toFixed(1)}%; background:${rem < 0 ? '#ff3b30' : div.color};"></div>
                    </div>
                  </td>
                  <td class="py-3.5 px-5 text-right whitespace-nowrap no-print">
                    <button
                      data-open-disburse="${sectionKey}:${item.id}"
                      class="h-8 px-3.5 rounded-xl text-xs font-semibold inline-flex items-center gap-1.5 transition ${
                        editable
                          ? 'bg-[#007aff]/10 text-[#007aff] hover:bg-[#007aff] hover:text-white'
                          : 'bg-black/[0.05] text-[#515154] hover:bg-black/[0.1]'
                      }"
                    >
                      <i data-lucide="${editable ? 'edit-3' : 'eye'}" class="w-3.5 h-3.5"></i>
                      <span>${editable ? 'เบิกจ่าย' : 'ดูข้อมูล'}</span>
                    </button>
                  </td>
                </tr>
              `;

            .join('');

    return `
      <div class="space-y-5">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
          <div>
            <p class="text-xs font-medium text-[#86868b]">ปีการศึกษา ${esc(state.activeYear)} • บันทึกการเบิกจ่ายได้สูงสุด 12 ครั้ง</p>
            <h2 class="text-2xl font-bold text-[#1d1d1f] mt-0.5">${esc(title)}</h2>
          </div>
          ${
            editable
              ? `<button data-add-item="${sectionKey}" class="ios-btn-primary h-10 px-4 text-xs font-semibold inline-flex items-center gap-1.5 self-start sm:self-auto no-print">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>เพิ่มรายการใหม่</span>
                </button>`
              : ''
          }
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="ios-card px-5 py-4 flex items-center justify-between">
            <span class="text-xs font-semibold text-[#86868b]">จัดสรรรวม (${stats.count} รายการ)</span>
            <span class="text-lg font-bold text-[#1d1d1f] num">${fmt(stats.allocated)} ฿</span>
          </div>
          <div class="ios-card px-5 py-4 flex items-center justify-between">
            <span class="text-xs font-semibold text-[#86868b]">เบิกจ่ายสะสม</span>
            <span class="text-lg font-bold text-[#ff9500] num">${fmt(stats.disbursed)} ฿</span>
          </div>
          <div class="ios-card px-5 py-4 flex items-center justify-between">
            <span class="text-xs font-semibold text-[#86868b]">คงเหลือสุทธิ</span>
            <span class="text-lg font-bold ${stats.remaining < 0 ? 'text-[#ff3b30]' : 'text-[#28a745]'} num">${fmt(stats.remaining)} ฿</span>
          </div>
        </div>

        
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 no-print">
          <div class="ios-segmented inline-flex flex-wrap gap-1 self-start">
            ${divisionChips}
          </div>
          <div class="flex flex-wrap items-center gap-2">
            ${
              !isOperating
                ? `<div class="h-9 px-3 rounded-xl bg-white/85 border border-black/10" style="display:inline-flex;align-items:center;gap:8px;">
                    <span class="text-xs font-semibold text-[#515154]">เฉพาะของฉัน</span>
                    <button type="button" id="toggle-mine-btn" class="ios-switch" data-checked="${filters.onlyMine ? 'true' : 'false'}" aria-label="เฉพาะโครงการของฉัน">
                      <span class="ios-switch-knob"></span>

                : ''
            }
            <div class="relative flex-1 sm:w-64">
              <i data-lucide="search" class="w-4 h-4 text-[#86868b] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input
                id="table-search"

                placeholder="ค้นหาโครงการหรือครู..."
                class="ios-input w-full h-9 pl-9 pr-3 text-xs font-medium"
              />
            </div>
          </div>
        </div>

        <div class="ios-card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-black/[0.02] text-xs text-[#86868b] border-b border-black/[0.06]">
                  <th class="py-3.5 px-5 font-semibold">รายการ / ฝ่าย</th>
                  <th class="py-3.5 px-3 font-semibold">${isOperating ? 'หมวดรายจ่าย' : 'ผู้รับผิดชอบ'}</th>
                  <th class="py-3.5 px-3 text-right font-semibold hidden xl:table-cell">จัดสรร 2569</th>
                  <th class="py-3.5 px-3 text-right font-semibold">จัดสรร ${esc(state.activeYear)}</th>
                  <th class="py-3.5 px-3 text-right font-semibold">เบิกจ่ายรวม</th>
                  <th class="py-3.5 px-3 text-right font-semibold">คงเหลือ</th>
                  <th class="py-3.5 px-5 text-right font-semibold no-print">จัดการ</th>
                </tr>
              </thead>
              <tbody>${rowsHTML}</tbody>
            </table>
          </div>
        </div>

    `;
  }

  // Modal: macOS Sheet for 12 Disbursements

  function openDisbursementModal(sectionKey, itemId) {
    const yearData = getCurrentYearData();
    const list = yearData[sectionKey] || [];
    const item = list.find((x) => x.id === itemId);
    if (!item) return;

    const editable = canEditBudget();
    const div = getDivision(item.divisionId);
    const totalDisb = sumDisbursements(item);
    const rem = (Number(item.allocated) || 0) - totalDisb;

    const divOptions = state.divisions
      .map((d) => `<option value="${d.id}" ${d.id === item.divisionId ? 'selected' : ''}>${esc(d.name)}</option>`)
      .join('');

    const teacherSuggestions = state.users.map((u) => `<option value="${esc(u.name)}"></option>`).join('');

    const disbRows = (item.disbursements || [])
      .map(
        (d, idx) => `
        <div class="grid grid-cols-12 gap-2 items-center px-3 py-2 rounded-xl border ${
          Number(d.amount) > 0 ? 'bg-emerald-50/70 border-emerald-200' : 'bg-black/[0.025] border-black/[0.05]'
        }">
          <div class="col-span-2 text-xs font-semibold text-[#515154] num">ครั้งที่ ${d.no}</div>
          <div class="col-span-5 sm:col-span-3">
            <input
              type="number"
              step="0.01"
              data-disb-amt="${idx}"
              value="${d.amount || ''}"
              placeholder="0.00"
              ${editable ? '' : 'disabled'}
              class="ios-input w-full h-8 px-2.5 text-right text-xs font-semibold num"
            />
          </div>
          <div class="col-span-5 sm:col-span-3">
            <input
              type="date"
              data-disb-date="${idx}"
              value="${esc(d.date || '')}"
              ${editable ? '' : 'disabled'}
              class="ios-input w-full h-8 px-2 text-xs num"
            />
          </div>
          <div class="col-span-12 sm:col-span-4">
            <input
              type="text"
              data-disb-note="${idx}"
              value="${esc(d.note || '')}"
              placeholder="หมายเหตุ / เลขที่ฎีกา"
              ${editable ? '' : 'disabled'}
              class="ios-input w-full h-8 px-2.5 text-xs"
            />
          </div>
        </div>
      `
      )
      .join('');

    const modalRoot = document.getElementById('modal-root');
    setModalOpenState(true);
    modalRoot.innerHTML = `
      <div id="modal-overlay" class="modal-backdrop-fixed">
        <div class="bg-white/95 backdrop-blur-2xl rounded-[26px] border border-white/80 shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden animate-sheet">
          <div class="ios-grabber"></div>
          <div class="px-6 py-3.5 border-b border-black/[0.06] flex items-start justify-between gap-4" style="border-top: 4px solid ${div.color};">
            <div class="min-w-0">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold mb-1" style="background:${div.bgSoft}; color:${div.textDark};">
                <span class="w-1.5 h-1.5 rounded-full" style="background:${div.color}"></span>
                ${esc(div.name)}
              </span>
              <h3 class="text-base sm:text-lg font-bold text-[#1d1d1f] leading-snug">${esc(item.name)}</h3>
            </div>
            <button id="close-modal-btn" class="w-8 h-8 rounded-full bg-black/[0.06] hover:bg-black/[0.12] flex items-center justify-center text-[#515154] shrink-0 transition">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="p-6 overflow-y-auto space-y-5 flex-1">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-[#515154] mb-1">ชื่อโครงการ / รายการ</label>
                <input id="edit-item-name" type="text" value="${esc(item.name)}" ${editable ? '' : 'disabled'} class="ios-input w-full h-10 px-3.5 text-sm font-semibold" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#515154] mb-1">ฝ่ายงาน (สีประจำฝ่าย)</label>
                <select id="edit-item-div" ${editable ? '' : 'disabled'} class="ios-input w-full h-10 px-3 text-sm font-medium">${divOptions}</select>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#515154] mb-1">${sectionKey === 'operating' ? 'หมวดรายจ่าย' : 'ผู้รับผิดชอบ'}</label>
                <input id="edit-item-resp" list="teacher-datalist" type="text" value="${esc(sectionKey === 'operating' ? item.category || '' : item.responsible || '')}" ${editable ? '' : 'disabled'} class="ios-input w-full h-10 px-3.5 text-sm font-medium" />
                <datalist id="teacher-datalist">${teacherSuggestions}</datalist>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 p-4 rounded-2xl bg-black/[0.03] border border-black/[0.05]">
              <div>
                <label class="block text-xs font-medium text-[#86868b] mb-1">งบจัดสรร ปี ${esc(state.activeYear)} (บาท)</label>
                <input id="edit-item-alloc" type="number" step="0.01" value="${item.allocated}" ${editable ? '' : 'disabled'} class="ios-input w-full h-9 px-3 text-sm font-bold num" />
              </div>
              <div class="flex flex-col justify-center">
                <span class="text-xs font-medium text-[#86868b]">รวมเบิกจ่าย (12 ครั้ง)</span>
                <span id="live-disb-sum" class="text-lg font-bold text-[#ff9500] num mt-0.5">${fmt(totalDisb)} ฿</span>
              </div>
              <div class="flex flex-col justify-center">
                <span class="text-xs font-medium text-[#86868b]">ยอดคงเหลือ</span>
                <span id="live-rem-sum" class="text-lg font-bold ${rem < 0 ? 'text-[#ff3b30]' : 'text-[#28a745]'} num mt-0.5">${fmt(rem)} ฿</span>
              </div>
            </div>

            <div>
              <h4 class="text-xs font-semibold text-[#515154] mb-2.5">บันทึกการเบิกจ่าย (ครั้งที่ 1 – ครั้งที่ 12)</h4>
              <div class="space-y-1.5">${disbRows}</div>
            </div>
          </div>

          <div class="px-6 py-4 border-t border-black/[0.06] bg-black/[0.02] flex items-center justify-between gap-3">
            ${
              editable
                ? `<button id="delete-item-btn" class="h-9 px-3.5 rounded-xl text-xs font-semibold text-[#ff3b30] hover:bg-rose-50 inline-flex items-center gap-1.5 transition">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>ลบรายการ</span>
                  </button>`
                : `<span class="text-xs text-[#86868b]">สิทธิ์ดูข้อมูลอย่างเดียว</span>`
            }
            <div class="flex items-center gap-2">
              <button id="cancel-modal-btn" class="ios-btn-secondary h-9 px-4 text-xs font-semibold">ปิดหน้าต่าง</button>
              ${
                editable
                  ? `<button id="save-item-btn" class="ios-btn-primary h-9 px-5 text-xs font-semibold inline-flex items-center gap-1.5">
                      <i data-lucide="save" class="w-4 h-4"></i>
                      <span>บันทึกข้อมูล</span>
                    </button>`
                  : ''
              }
            </div>
          </div>
        </div>
      </div>
    `;

    renderIcons(modalRoot);

    const closeModal = () => {
      setModalOpenState(false);
      modalRoot.innerHTML = '';
    };
    document.getElementById('close-modal-btn').addEventListener('click', closeModal);
    document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    const recalc = () => {
      const alloc = Number(document.getElementById('edit-item-alloc').value) || 0;
      let sum = 0;
      modalRoot.querySelectorAll('[data-disb-amt]').forEach((inp) => {
        sum += Number(inp.value) || 0;
      });
      const r = alloc - sum;
      document.getElementById('live-disb-sum').textContent = fmt(sum) + ' ฿';
      const remEl = document.getElementById('live-rem-sum');
      remEl.textContent = fmt(r) + ' ฿';
      remEl.className = `text-lg font-bold num mt-0.5 ${r < 0 ? 'text-[#ff3b30]' : 'text-[#28a745]'}`;
    };

    modalRoot.querySelectorAll('#edit-item-alloc, [data-disb-amt]').forEach((inp) => {
      inp.addEventListener('input', recalc);
    });

    if (editable) {
      document.getElementById('save-item-btn').addEventListener('click', async () => {
        item.name = document.getElementById('edit-item-name').value.trim() || item.name;
        item.divisionId = document.getElementById('edit-item-div').value;
        const respVal = document.getElementById('edit-item-resp').value.trim();
        if (sectionKey === 'operating') item.category = respVal;
        else item.responsible = respVal;
        item.allocated = Number(document.getElementById('edit-item-alloc').value) || 0;

        for (let i = 0; i < 12; i++) {
          const amtEl = modalRoot.querySelector(`[data-disb-amt="${i}"]`);
          const dateEl = modalRoot.querySelector(`[data-disb-date="${i}"]`);
          const noteEl = modalRoot.querySelector(`[data-disb-note="${i}"]`);
          item.disbursements[i] = {
            no: i + 1,
            amount: Number(amtEl?.value) || 0,
            date: dateEl?.value || '',
            note: noteEl?.value.trim() || '',
          };
        }

        await saveState();
        closeModal();
        renderApp();
      });

      document.getElementById('delete-item-btn').addEventListener('click', async () => {
        if (!confirm(`ยืนยันการลบรายการ "${item.name}"`)) return;
        yearData[sectionKey] = yearData[sectionKey].filter((x) => x.id !== itemId);
        await saveState();
        closeModal();
        renderApp();
      });
    }
  }

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                <label class="block text-xs font-medium text-[#515154] mb-1">ฝ่ายงาน</label>

                <input id="new-item-resp" list="new-teacher-list" type="text" placeholder="${sectionKey === 'operating' ? 'ค่าวัสดุ / ค่าใช้สอย' : 'ระบุชื่อครู'}" class="ios-input w-full h-10 px-3.5 text-sm" />
                <datalist id="new-teacher-list">${teacherOptions}</datalist>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="cancel-add-modal" class="ios-btn-secondary h-9 px-4 text-xs font-semibold">ยกเลิก</button>
              <button type="submit" class="ios-btn-primary h-9 px-5 text-xs font-semibold">เพิ่มรายการ</button>
            </div>
          </form>
        </div>
      </div>
    `;
    renderIcons(modalRoot);

    const close = () => {
      setModalOpenState(false);
      modalRoot.innerHTML = '';
    };
    document.getElementById('close-add-modal').addEventListener('click', close);
    document.getElementById('cancel-add-modal').addEventListener('click', close);

    document.getElementById('add-item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const yearData = getCurrentYearData();
      const emptyDisb = Array.from({ length: 12 }, (_, i) => ({ no: i + 1, amount: 0, date: '', note: '' }));
      const resp = document.getElementById('new-item-resp').value.trim();
      const newObj = {
        id: `${sectionKey}-${Date.now()}`,
        name: document.getElementById('new-item-name').value.trim(),
        divisionId: document.getElementById('new-item-div').value,
        allocated2568: 0,
        remain2568: 0,
        allocated2569: 0,

        disbursements: emptyDisb,

      if (sectionKey === 'operating') newObj.category = resp || 'ค่าใช้สอย';
      else newObj.responsible = resp || currentUser.name;

      yearData[sectionKey].push(newObj);
      await saveState();
      close();
      renderApp();
    });
  }

  // ==========================================================
  // Export CSV
  // ==========================================================
  function exportCSV() {
    const yearData = getCurrentYearData();
    const lines = [
      ['หมวดงบประมาณ', 'ฝ่ายงาน', 'ชื่อรายการ/โครงการ', 'ผู้รับผิดชอบ/ประเภท', `จัดสรร ${state.activeYear}`, 'เบิกจ่ายรวม', 'คงเหลือ'],
    ];

    const pushSection = (label, arr, isOp = false) => {
      (arr || []).forEach((item) => {
        const div = getDivision(item.divisionId);
        const disb = sumDisbursements(item);
        const rem = (Number(item.allocated) || 0) - disb;
        lines.push([label, div.name, item.name, isOp ? item.category || '' : item.responsible || '', item.allocated || 0, disb, rem]);
      });
    };

    pushSection('งบโครงการ (รายหัว)', yearData.projects);
    pushSection('งบดำเนินงาน (รายจ่ายประจำ)', yearData.operating, true);
    pushSection('กิจกรรมพัฒนาผู้เรียน', yearData.activities);
    pushSection('งบนโยบายสนับสนุน', yearData.policySubsidies);

    const csvContent = '\uFEFF' + lines.map((row) => row.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `EBudget_โรงเรียนบ้านป่าไผ่_ปี${state.activeYear}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('ส่งออกไฟล์ Excel (CSV) เรียบร้อยแล้ว', 'success');
  }

        filters.search = '';
        mobileMenuOpen = false;
        renderApp();
      });
    });

    const yearSel = document.getElementById('year-selector');
    if (yearSel) {
      yearSel.addEventListener('change', async (e) => {
        state.activeYear = e.target.value;
        await saveState(true);
        showToast(`สลับเป็นปีการศึกษา ${state.activeYear}`, 'info');
        renderApp();
      });
    }

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        currentUser = null;
        adminPreviewViewer = false;
        safeRemoveStorage('session', SESSION_KEY);
        renderLogin();
      });
    }

    const togglePreview = document.getElementById('toggle-preview-btn');

        showToast(adminPreviewViewer ? 'สลับเป็นมุมมองครูผู้ใช้งานทั่วไป' : 'กลับสู่โหมดแอดมิน', 'info');
        renderApp();
      });

    const backdrop = document.getElementById('mobile-backdrop');
    if (mobileBtn) {
      mobileBtn.addEventListener('click', () => {
        mobileMenuOpen = !mobileMenuOpen;
        renderApp();
      });
    }
    if (backdrop) {
      backdrop.addEventListener('click', () => {
        mobileMenuOpen = false;
        renderApp();
      });
    }

    const csvBtn = document.getElementById('btn-export-csv');
    if (csvBtn) csvBtn.addEventListener('click', exportCSV);

    const printBtn = document.getElementById('btn-print');
    if (printBtn) printBtn.addEventListener('click', openPrintReportModal);

    if (ccBtn) {
      ccBtn.addEventListener('click', () => {

  function bindActiveTabEvents(yearData, metrics) {
    if (activeTab === 'dashboard') {
      renderDashboardCharts(metrics);
      document.querySelectorAll('[data-jump-division]').forEach((card) => {
        card.addEventListener('click', () => {
          filters.divisionId = card.dataset.jumpDivision;
          activeTab = 'projects';
          renderApp();
        });
      });
    }

    document.querySelectorAll('[data-nav-jump]').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.navJump;
        filters.divisionId = 'all';
        renderApp();
      });
    });

    if (activeTab === 'income') {
      const saveIncBtn = document.getElementById('save-income-btn');
      if (saveIncBtn) {
        saveIncBtn.addEventListener('click', async () => {
          const pcCarry = document.getElementById('inc-pc-carry');
          const actCarry = document.getElementById('inc-act-carry');
          if (pcCarry) yearData.income.perCapitaCarryOver = Number(pcCarry.value) || 0;
          if (actCarry) yearData.income.activityCarryOver = Number(actCarry.value) || 0;
          document.querySelectorAll('[data-grade-idx]').forEach((inp) => {
            const idx = Number(inp.dataset.gradeIdx);
            const field = inp.dataset.gradeField;
            if (yearData.income.grades[idx]) yearData.income.grades[idx][field] = Number(inp.value) || 0;
          });
          await saveState();
          renderApp();
        });
      }
    }

    document.querySelectorAll('[data-filter-div]').forEach((btn) => {
      btn.addEventListener('click', () => {
        filters.divisionId = btn.dataset.filterDiv;
        renderApp();
      });
    });

    const mineBtn = document.getElementById('toggle-mine-btn');
    if (mineBtn) {
      mineBtn.addEventListener('click', () => {
        filters.onlyMine = !filters.onlyMine;
        renderApp();
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        filters.search = e.target.value;
        const pos = e.target.selectionStart;
        renderApp();
        const newInput = document.getElementById('table-search');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(pos, pos);
        }
      });
    }

    document.querySelectorAll('[data-open-disburse]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [sec, id] = btn.dataset.openDisburse.split(':');
        openDisbursementModal(sec, id);
      });
    });

    document.querySelectorAll('[data-add-item]').forEach((btn) => {
      btn.addEventListener('click', () => openAddItemModal(btn.dataset.addItem));
    });

    if (activeTab === 'admin' && canAdminSystem()) {
      const logoInput = document.getElementById('logo-file-input');
      if (logoInput) {
        logoInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (ev) => {
            state.school.logoDataUrl = ev.target.result;
            await saveState();
            renderApp();
          };
          reader.readAsDataURL(file);
        });
      }

      const removeLogoBtn = document.getElementById('remove-logo-btn');
      if (removeLogoBtn) {
        removeLogoBtn.addEventListener('click', async () => {
          state.school.logoDataUrl = '';
          await saveState();
          renderApp();
        });
      }

      const saveSchoolBtn = document.getElementById('save-school-btn');
      if (saveSchoolBtn) {
        saveSchoolBtn.addEventListener('click', async () => {
          state.school.name = document.getElementById('school-name-input').value.trim() || state.school.name;
          state.school.area = document.getElementById('school-area-input').value.trim() || state.school.area;
          await saveState();
          renderApp();
        });
      }

      const addYearBtn = document.getElementById('add-year-btn');
      if (addYearBtn) {
        addYearBtn.addEventListener('click', async () => {
          const yr = String(document.getElementById('new-year-input').value).trim();
          if (!yr || yr.length !== 4) {
            showToast('กรุณากรอกปีการศึกษาเป็นเลข 4 หลัก', 'error');
            return;
          }
          if (state.years[yr]) {
            showToast(`มีปีการศึกษา ${yr} อยู่ในระบบแล้ว`, 'error');
            return;
          }
          const shouldClone = document.getElementById('clone-year-checkbox').checked;
          if (shouldClone) {
            const cloned = JSON.parse(JSON.stringify(getCurrentYearData()));
            cloned.year = yr;
            cloned.label = `ปีการศึกษา ${yr}`;
            const resetDisb = (arr) =>
              (arr || []).forEach((it) => {
                it.disbursements = Array.from({ length: 12 }, (_, i) => ({ no: i + 1, amount: 0, date: '', note: '' }));
              });
            resetDisb(cloned.projects);
            resetDisb(cloned.operating);
            resetDisb(cloned.activities);
            resetDisb(cloned.policySubsidies);
            state.years[yr] = cloned;
          } else {
            state.years[yr] = {
              year: yr,
              label: `ปีการศึกษา ${yr}`,
              income: JSON.parse(JSON.stringify(getCurrentYearData().income)),
              projects: [],
              operating: [],
              activities: [],
              policySubsidies: [],
            };
          }
          state.activeYear = yr;
          await saveState();
          showToast(`เพิ่มปีการศึกษา ${yr} เรียบร้อยแล้ว`, 'success');
          renderApp();
        });
      }

      document.querySelectorAll('[data-switch-year]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.activeYear = btn.dataset.switchYear;
          await saveState(true);
          renderApp();
        });
      });

      document.querySelectorAll('[data-delete-year]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const yr = btn.dataset.deleteYear;
          if (!confirm(`ยืนยันการลบข้อมูลปีการศึกษา ${yr}`)) return;
          delete state.years[yr];
          if (state.activeYear === yr) {
            state.activeYear = Object.keys(state.years).sort((a, b) => Number(b) - Number(a))[0];
          }
          await saveState();
          renderApp();
        });
      });

      const addUserBtn = document.getElementById('add-user-btn');
      if (addUserBtn) addUserBtn.addEventListener('click', () => openUserModal(null));

      document.querySelectorAll('[data-edit-user]').forEach((btn) => {
        btn.addEventListener('click', () => openUserModal(btn.dataset.editUser));
      });

      document.querySelectorAll('[data-delete-user]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const uid = btn.dataset.deleteUser;
          const u = state.users.find((x) => x.id === uid);
          if (!confirm(`ยืนยันการลบบัญชี "${u?.name}"`)) return;
          state.users = state.users.filter((x) => x.id !== uid);
          await saveState();
          renderApp();
        });
      });

      const saveDivBtn = document.getElementById('save-divisions-btn');
      if (saveDivBtn) {
        saveDivBtn.addEventListener('click', async () => {
          state.divisions.forEach((d, idx) => {
            const c = document.querySelector(`[data-div-color="${idx}"]`)?.value;
            const n = document.querySelector(`[data-div-name="${idx}"]`)?.value.trim();
            const s = document.querySelector(`[data-div-short="${idx}"]`)?.value.trim();
            if (c) d.color = c;
            if (n) d.name = n;
            if (s) d.shortName = s;
          });
          await saveState();
          renderApp();
        });
      }

      const backupBtn = document.getElementById('backup-json-btn');
      if (backupBtn) {
        backupBtn.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `EBudget_Backup_BanPaPhai_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('ดาวน์โหลดไฟล์สำรองข้อมูลเรียบร้อย', 'success');
        });
      }

      const restoreInput = document.getElementById('restore-json-input');
      if (restoreInput) {
        restoreInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (!parsed.years || !parsed.users) throw new Error('Invalid');
              state = parsed;
              await saveState();
              showToast('นำเข้าข้อมูลสำรองสำเร็จ', 'success');
              renderApp();
            } catch (_) {
              showToast('ไฟล์สำรองไม่ถูกต้อง', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      const resetBtn = document.getElementById('reset-seed-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', async () => {
          if (!confirm('ยืนยันรีเซ็ตข้อมูลทั้งหมดกลับเป็นข้อมูลเริ่มต้นปีการศึกษา 2570')) return;
          state = window.createInitialState();
          await saveState();
          showToast('รีเซ็ตข้อมูลเรียบร้อยแล้ว', 'info');
          renderApp();
        });
      }
    }
  }

  // ==========================================================
  // Bootstrap (Instant render first, then sync with Google Sheet / API)
  // ==========================================================
  async function init() {
    try {
      // 0. Restore iOS Dark Mode preference
      darkMode = safeGetStorage('local', THEME_KEY) === '1';
      applyDarkMode();

      // 1. Load instantly from localStorage or seed so UI renders in <50ms (never blank white!)
      const cached = safeGetStorage('local', STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.years) state = parsed;
        } catch (_) {}
      }
      if (!state) {
        state = window.createInitialState();
      }
      restoreSession();
      renderApp();

      // 2. Sync live data from Google Sheet (GAS) or Local Server in background
      if (isGAS()) {
        try {
          const raw = await gasCall('getBudgetState');
          if (raw && typeof raw === 'string' && raw.length > 10) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.years) {
              state = parsed;
              safeSetStorage('local', STORAGE_KEY, raw);
              restoreSession();
              renderApp();
              return;
            }
          }
          // First run: populate Google Sheet in background
          saveState(true);
        } catch (err) {
          console.warn('GAS background sync skipped:', err);
        }
      } else {
        try {
          const res = await fetch('/api/state');
          if (res.ok) {
            const data = await res.json();
            if (data && !data.empty && data.years) {
              state = data;
              safeSetStorage('local', STORAGE_KEY, JSON.stringify(state));
              restoreSession();
              renderApp();
            }
          }
        } catch (_) {}
      }
    } catch (err) {
      console.error('Init error:', err);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = `<div style="padding:24px;font-family:'Noto Sans Thai',sans-serif;color:#b91c1c;">เกิดข้อผิดพลาดในการโหลดระบบ: ${esc(err && err.message ? err.message : String(err))}</div>`;
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
  </body>
</html>

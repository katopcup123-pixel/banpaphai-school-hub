<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F9FC" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="metaStatusBar" />
  <meta name="apple-mobile-web-app-title" content="BPP Connect" />
  <title>BPP Connect — โรงเรียนบ้านป่าไผ่</title>
  <link rel="icon" type="image/png" href="./icons/school-logo.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/school-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="stage">
    <div class="iphone-frame">
      <div class="hw-btn hw-action" aria-hidden="true"></div>
      <div class="hw-btn hw-vol-up" aria-hidden="true"></div>
      <div class="hw-btn hw-vol-down" aria-hidden="true"></div>
      <div class="hw-btn hw-power" aria-hidden="true"></div>

      <div class="iphone-screen">
        <!-- Live Clean-White WebGPU Shader Background -->
        <div id="shaderBgHost" class="shader-bg-host" aria-hidden="true"></div>

        <!-- iOS Status Bar + Interactive Dynamic Island (Desktop Preview Only) -->
        <div class="ios-status-bar">
          <span class="ios-time" id="iosClock">09:41</span>
          <div class="dynamic-island" id="dynamicIsland" role="status" aria-live="polite">
            <span class="island-dot"></span>
            <span class="island-text" id="islandText"></span>
          </div>
          <div class="ios-indicators" aria-hidden="true">
            <svg width="16" height="11" viewBox="0 0 18 12" fill="currentColor">
              <rect x="0" y="7" width="3" height="5" rx="1"/>
              <rect x="4.5" y="5" width="3" height="7" rx="1"/>
              <rect x="9" y="2.5" width="3" height="9.5" rx="1"/>
              <rect x="13.5" y="0" width="3" height="12" rx="1"/>
            </svg>
            <svg width="15" height="11" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M1.5 4.2C5.2 0.8 10.8 0.8 14.5 4.2"/>
              <path d="M4.2 7C6.4 5 9.6 5 11.8 7"/>
              <circle cx="8" cy="10.2" r="1.1" fill="currentColor" stroke="none"/>
            </svg>
            <div class="ios-battery"><div class="ios-battery-fill"></div></div>
          </div>
        </div>

        <!-- 1. Animated Splash Screen -->
        <section class="splash-overlay" id="splashOverlay" aria-label="หน้าจอเริ่มต้น">
          <div class="splash-inner">
            <div class="splash-crest-wrap">
              <div class="splash-ring"></div>
              <img class="splash-logo" src="./icons/school-logo.png" alt="ตราโรงเรียนบ้านป่าไผ่" />
            </div>
            <h1 class="splash-title">BPP Connect</h1>
            <p class="splash-sub">โรงเรียนบ้านป่าไผ่ • สพป.นครราชสีมา เขต 4</p>
            <div class="splash-pill">ศูนย์รวมระบบงานบริหาร</div>
            <div class="splash-loader"><span></span></div>
          </div>
        </section>

        <!-- 2. iOS Login Screen (User Picker + Instant iOS PIN Keypad) -->
        <section class="login-overlay hidden" id="loginOverlay" aria-label="เข้าสู่ระบบ">
          <div class="login-scroll" id="loginViewList">
            <div class="login-hero">
              <div class="login-crest">
                <img src="./icons/school-logo.png" alt="ตราโรงเรียนบ้านป่าไผ่" />
              </div>
              <h2>BPP Connect</h2>
              <p>เลือกชื่อบุคลากรเพื่อเข้าสู่ระบบ</p>
            </div>
            <div class="user-list" id="userList"></div>
          </div>

          <div class="pin-view hidden" id="loginViewPin">
            <button class="pin-back-btn" id="pinBackBtn" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              <span>เปลี่ยนผู้ใช้</span>
            </button>
            <div class="pin-user-head" id="pinUserHead"></div>
            <div class="pin-dots" id="pinDots">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="pin-hint" id="pinHint">กรอกรหัส PIN 4 หลัก (เริ่มต้น: 1234)</div>
            <div class="ios-keypad" id="iosKeypad">
              <button type="button" class="key-btn" data-key="1">1</button>
              <button type="button" class="key-btn" data-key="2">2</button>
              <button type="button" class="key-btn" data-key="3">3</button>
              <button type="button" class="key-btn" data-key="4">4</button>
              <button type="button" class="key-btn" data-key="5">5</button>
              <button type="button" class="key-btn" data-key="6">6</button>
              <button type="button" class="key-btn" data-key="7">7</button>
              <button type="button" class="key-btn" data-key="8">8</button>
              <button type="button" class="key-btn" data-key="9">9</button>
              <button type="button" class="key-btn key-ghost" data-key="clear">ล้าง</button>
              <button type="button" class="key-btn" data-key="0">0</button>
              <button type="button" class="key-btn key-ghost" data-key="del" aria-label="ลบ">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- 3. Post-Login iOS Unlock Checkmark Animation -->
        <section class="unlock-overlay hidden" id="unlockOverlay" aria-hidden="true">
          <div class="unlock-card">
            <div class="unlock-circle">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path class="check-path" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <div class="unlock-greeting">ยินดีต้อนรับ</div>
            <h3 id="unlockName"></h3>
            <p id="unlockPosition"></p>
          </div>
        </section>

        <!-- 4. Main App Viewport (Header LOCKED outside scroll so pulling down never drags the header) -->
        <div class="app-container hidden" id="appContainer">
          <header class="ios-header" id="iosHeader">
            <div class="header-row">
              <div class="brand">
                <div class="brand-crest">
                  <img id="schoolLogo" src="./icons/school-logo.png" alt="ตราโรงเรียนบ้านป่าไผ่" />
                </div>
                <div class="brand-text">
                  <h1 id="schoolName">BPP Connect</h1>
                  <p id="schoolSubtitle">โรงเรียนบ้านป่าไผ่ • สพป.นครราชสีมา เขต 4</p>
                </div>
              </div>
              <div class="header-actions">
                <button class="ios-role-pill" id="userChipBtn" title="ข้อมูลผู้ใช้งาน">
                  <span class="role-dot"></span>
                  <span id="userChipLabel">เข้าสู่ระบบ</span>
                </button>
                <button class="ios-circle-btn" id="bellBtn" aria-label="การแจ้งเตือน">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                  </svg>
                  <span class="badge-count hidden" id="bellBadge">0</span>
                </button>
              </div>
            </div>

            <!-- iOS Notification Balloon Popover -->
            <div class="notif-balloon hidden" id="notifBalloon" role="dialog" aria-label="บอลลูนการแจ้งเตือน">
              <div class="balloon-arrow"></div>
              <div class="balloon-head">
                <strong>การแจ้งเตือน</strong>
                <button type="button" class="balloon-read-all" id="markAllReadBtn">อ่านทั้งหมดแล้ว</button>
              </div>
              <div class="balloon-list" id="balloonList"></div>
            </div>

            <div class="ios-search-wrap">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
              <input id="searchInput" class="ios-search-input" type="search" placeholder="ค้นหาระบบงาน..." autocomplete="off" />
              <button id="searchClear" class="ios-search-clear" aria-label="ล้างคำค้น">&times;</button>
            </div>
          </header>

          <div class="app-scroll" id="appScroll">
            <main id="mainContent" class="main-content"></main>
          </div>
        </div>

        <!-- iOS Frosted Glass Tab Bar -->
        <nav class="ios-tab-bar" id="iosTabBar" aria-label="เมนูหลัก">
          <button class="tab-item active" data-tab="home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>หน้าหลัก</span>
          </button>
          <button class="tab-item" data-tab="favorites">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>รายการโปรด</span>
          </button>
          <button class="tab-item" data-tab="announcements">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span>ประกาศ</span>
          </button>
          <button class="tab-item" data-tab="settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>ตั้งค่า</span>
          </button>
        </nav>

        <!-- Floating Native-Style Pill for Real Phones -->
        <div class="mobile-pill" id="mobilePill" role="status" aria-live="polite">
          <span class="island-dot"></span>
          <span id="mobilePillText"></span>
        </div>

        <!-- iOS Home Indicator (Desktop Preview Only) -->
        <div class="ios-home-indicator" aria-hidden="true"><span></span></div>

        <!-- In-App Native iOS Viewer for GAS Systems -->
        <section class="inapp-overlay hidden" id="inAppOverlay" aria-label="หน้าต่างระบบงาน">
          <div class="inapp-bar">
            <button type="button" class="inapp-back" id="inAppBackBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              <span>กลับ</span>
            </button>
            <div class="inapp-title" id="inAppTitle">กำลังโหลด...</div>
            <div class="inapp-actions">
              <button type="button" class="inapp-icon-btn" id="inAppReloadBtn" aria-label="รีโหลด">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              </button>
              <button type="button" class="inapp-icon-btn" id="inAppExternalBtn" aria-label="เปิดในเบราว์เซอร์">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
              </button>
            </div>
          </div>
          <div class="inapp-body">
            <div class="inapp-loading" id="inAppLoading">
              <div class="ios-spinner"></div>
              <span>กำลังเชื่อมต่อระบบ...</span>
            </div>
            <iframe id="inAppFrame" class="inapp-frame" title="ระบบงานโรงเรียน" allow="camera; microphone; geolocation; clipboard-write; fullscreen"></iframe>
          </div>
        </section>

        <!-- iOS Spring Bottom Sheet Modal -->
        <div class="sheet-backdrop" id="sheetBackdrop">
          <div class="ios-sheet" id="iosSheet" role="dialog" aria-modal="true">
            <div class="sheet-grabber"></div>
            <div id="sheetBody"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script type="module" src="./shader-bg.js"></script>
  <script src="./apps-config.js"></script>
  <script src="./students-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
